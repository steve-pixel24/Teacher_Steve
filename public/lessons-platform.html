    if(!q){area.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-500)"><div style="font-size:48px;margin-bottom:12px">📖</div><p>Start typing to search</p></div>';return}
    if(!results.length){area.innerHTML='<div style="text-align:center;padding:40px;color:var(--gray-500)"><div style="font-size:48px;margin-bottom:12px">🔍</div><p>No results found</p></div>';return}
    area.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px">${results.map(r=>`<div class="dict-entry" data-word="${r.word}" style="padding:16px;background:var(--white);border:1px solid var(--gray-200);border-radius:8px;cursor:pointer;text-align:left;transition:all .2s" onmouseover="this.style.borderColor='var(--brand-orange)';this.style.background='var(--brand-light-sand)'" onmouseout="this.style.borderColor='var(--gray-200)';this.style.background='var(--white)'"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:18px;font-weight:700;color:var(--brand-charcoal)">${r.word}</span>${r.hasComparison?'<span style="font-size:16px">🌍</span>':''}</div><span style="font-size:12px;color:var(--gray-500);font-style:italic">${r.pos}</span></div><p style="font-size:13px;color:var(--gray-600);margin:0;line-height:1.5">${r.def}</p></div>`).join('')}</div>`;
    document.querySelectorAll('.dict-entry').forEach(el=>el.addEventListener('click',()=>showDictDetail(el.dataset.word)));
  });
}

function showDictDetail(word){
  const entry=dictionary.find(e=>e.word===word||(e.uk&&e.uk===word)||(e.us&&e.us===word));
  if(!entry)return;
  const area=document.getElementById('dictResults');
  area.innerHTML=`<div>
    <button onclick="attachDictionaryEvents();document.getElementById('dictSearch').value='';document.getElementById('dictSearch').dispatchEvent(new Event('input'))" style="margin-bottom:16px;padding:8px 16px;background:var(--gray-100);border:1px solid var(--gray-300);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:var(--brand-charcoal)">← Back to Results</button>
    <div style="background:var(--brand-light-sand);border-radius:12px;padding:24px;margin-bottom:16px">
      <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:8px"><h3 class="font-heading" style="font-size:32px;font-weight:800;color:var(--brand-charcoal);margin:0">${entry.word}</h3><span style="font-size:14px;font-style:italic;color:var(--gray-500)">${entry.phonetic}</span></div>
      <span style="display:inline-block;font-size:12px;font-weight:600;color:var(--brand-orange);background:rgba(227,108,36,.1);padding:4px 12px;border-radius:6px;text-transform:uppercase">${entry.pos}</span>
    </div>
    <div style="margin-bottom:16px"><h4 style="font-size:12px;font-weight:700;color:var(--brand-charcoal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Definition</h4><p style="font-size:15px;color:var(--gray-600);line-height:1.6;margin:0">${entry.def}</p></div>
    <div style="margin-bottom:16px"><h4 style="font-size:12px;font-weight:700;color:var(--brand-charcoal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Synonyms</h4><div style="display:flex;flex-wrap:wrap;gap:8px">${entry.synonyms.map(s=>`<span style="font-size:13px;color:var(--brand-charcoal);background:var(--gray-100);padding:6px 12px;border-radius:6px">${s}</span>`).join('')}</div></div>
    <div style="margin-bottom:16px"><h4 style="font-size:12px;font-weight:700;color:var(--brand-charcoal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Example</h4><p style="font-size:14px;color:var(--gray-600);font-style:italic;padding:12px 16px;background:var(--gray-100);border-radius:8px;border-left:3px solid var(--brand-orange);margin:0;line-height:1.6">"${entry.example}"</p></div>
    ${entry.hasComparison?`<div><h4 style="font-size:12px;font-weight:700;color:var(--brand-charcoal);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px">🌍 British vs American English</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div style="background:rgba(59,130,246,.05);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:16px"><div style="font-size:24px;margin-bottom:8px">🇬🇧</div><div style="font-size:11px;font-weight:700;color:var(--blue);text-transform:uppercase;margin-bottom:4px">British</div><div style="font-size:18px;font-weight:700;color:var(--brand-charcoal);margin-bottom:4px">${entry.uk}</div></div>
      <div style="background:rgba(239,68,68,.05);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:16px"><div style="font-size:24px;margin-bottom:8px">🇺🇸</div><div style="font-size:11px;font-weight:700;color:var(--red);text-transform:uppercase;margin-bottom:4px">American</div><div style="font-size:18px;font-weight:700;color:var(--brand-charcoal);margin-bottom:4px">${entry.us}</div></div>
    </div></div>`:''}
  </div>`;
}

// ==================== ACTIONS ====================
function doLogout(){state={view:'login',studentName:'',studentCode:'',isAdmin:false,score:0,activeCategory:null,activeLesson:null,activeStory:null,activeTest:null,activeGame:null,factIndex:0};lessonState={section:0,completed:new Set(),timer:0,timerInterval:null};render()}
function goHome(){state.view='home';state.activeLesson=null;state.activeStory=null;state.activeTest=null;state.activeGame=null;state.activeCategory=null;render()}
function goBackToCategory(){if(state.activeCategory==='vocabulary'){state.view='vocabulary'}else{state.view='category'}state.activeLesson=null;state.activeStory=null;state.activeTest=null;state.activeGame=null;state.activeVocabSubcategory=null;lessonState={section:0,completed:new Set(),timer:0,timerInterval:null};storyState={page:0,fontSize:16,done:false};testState={q:0,answers:[],submitted:false,score:0};stopGame();gameState={word:'',scrambled:'',input:'',score:0,time:60,over:false,done:false,timer:null};vocabPracticeState={mode:'learn',wordIndex:0,showDefinition:false,quizAnswers:[],quizSubmitted:false,matchingPairs:{left:null,right:null,matched:new Set()}};render()}
function openCategory(c){state.activeCategory=c;if(c==='vocabulary'){state.view='vocabulary'}else{state.view='category'}render()}

function openVocabSubcategory(id){
  const sub=vocabSubcategories.find(s=>s.id===id);
  if(sub){
    state.activeVocabSubcategory=sub;
    state.view='vocabPractice';
    vocabPracticeState={mode:'learn',wordIndex:0,showDefinition:false,quizAnswers:new Array(sub.words.length).fill(null),quizSubmitted:false,matchingPairs:{left:null,right:null,matched:new Set()}};
    render();
  }
}

let vocabPracticeState={mode:'learn',wordIndex:0,showDefinition:false,quizAnswers:[],quizSubmitted:false,matchingPairs:{left:null,right:null,matched:new Set()}};

function openLesson(id){state.activeLesson=lessons.find(l=>l.id===id);lessonState={section:0,completed:new Set(),timer:0,timerInterval:null};state.view='lesson';updateProgress('lesson',id,{status:'in-progress',progress:0});render()}
function openStory(id){state.activeStory=stories.find(s=>s.id===id);storyState={page:0,fontSize:16,done:false};state.view='story';updateProgress('story',id,{status:'in-progress',progress:0});render()}
function openTest(id){state.activeTest=tests.find(t=>t.id===id);testState={q:0,answers:[],submitted:false,score:0};state.view='test';updateProgress('test',id,{status:'in-progress',progress:0});render()}
function openGame(id){state.activeGame=games.find(g=>g.id===id);const w=WORDS[Math.floor(Math.random()*WORDS.length)];gameState={word:w,scrambled:scramble(w),input:'',score:0,time:60,over:false,done:false,timer:null};state.view='game';updateProgress('game',id,{status:'in-progress',progress:0});startGameTimer()}

function completeSection(){lessonState.completed.add(lessonState.section);if(lessonState.section<state.activeLesson.sections.length-1){lessonState.section++;render()}else{const pct=Math.round(lessonState.completed.size/state.activeLesson.sections.length*100);updateProgress('lesson',state.activeLesson.id,{status:'completed',progress:100})}}
function nextSection(){lessonState.completed.add(lessonState.section);lessonState.section++;render()}
function prevSection(){if(lessonState.section>0){lessonState.section--;render()}}
function goToSection(i){lessonState.section=i;render()}
function finishLesson(){completeItem('lesson',state.activeLesson.id,50);state.score+=50;const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);if(s){s.xp+=50;s.lessonsCompleted=(s.lessonsCompleted||0)+1;s.activitiesCompleted=(s.activitiesCompleted||0)+1;saveStudents(students)}const stats=loadProgress().filter(p=>p.status==='completed').length;const newA=checkAchievements('lessons_completed',stats);newA.forEach(a=>{showToast(a);state.score+=a.xp});goBackToCategory()}

function quizNext(){const qs=window._quiz;const s=state.activeLesson.sections[lessonState.section];if(qs.q<s.quiz.questions.length-1){qs.q++;document.getElementById('quizArea').innerHTML=renderQuizQ(s.quiz,qs.q);attachEvents()}else{qs.done=true;document.getElementById('quizArea').innerHTML=renderQuizQ(s.quiz,qs.q);attachEvents()}}

function fcPrev(){const fs=window._fc;fs.flipped=false;if(fs.i>0){fs.i--;document.getElementById('fcArea').innerHTML=renderFC(state.activeLesson.sections[lessonState.section].flashcards);attachEvents()}}
function fcNext(){const fs=window._fc;const fcs=state.activeLesson.sections[lessonState.section].flashcards;fs.flipped=false;if(fs.i<fcs.cards.length-1){fs.i++;document.getElementById('fcArea').innerHTML=renderFC(fcs);attachEvents()}}
function fcMark(known){const fs=window._fc;const fcs=state.activeLesson.sections[lessonState.section].flashcards;if(known)fs.known.add(fs.i);fs.flipped=false;if(fs.i<fcs.cards.length-1)fs.i++;document.getElementById('fcArea').innerHTML=renderFC(fcs);attachEvents()}

function storyNext(){const s=state.activeStory;const pages=s.content.split('\n\n').filter(p=>p.trim());if(storyState.page<pages.length-1){storyState.page++;render()}}
function storyPrev(){if(storyState.page>0){storyState.page--;render()}}
function changeFontSize(d){storyState.fontSize=Math.max(14,Math.min(24,storyState.fontSize+d));render()}
function finishStory(){storyState.done=true;completeItem('story',state.activeStory.id,50);state.score+=50;const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);if(s){s.xp+=50;s.storiesRead=(s.storiesRead||0)+1;s.activitiesCompleted=(s.activitiesCompleted||0)+1;saveStudents(students)}const stats=loadProgress().filter(p=>p.type==='story'&&p.status==='completed').length;const newA=checkAchievements('stories_read',stats);newA.forEach(a=>{showToast(a);state.score+=a.xp});render()}

function testPrev(){if(testState.q>0){testState.q--;render()}}
function testNext(){const t=state.activeTest;if(testState.q<t.questionCount-1){testState.q++;render()}else{const qs=generateTestQuestions(t);let correct=0;testState.answers.forEach((a,i)=>{if(a===qs[i].correctAnswer)correct++});testState.score=correct;testState.submitted=true;if(correct===t.questionCount){const c=parseInt(localStorage.getItem(STORAGE_KEYS.perfectTests)||'0')+1;localStorage.setItem(STORAGE_KEYS.perfectTests,''+c);const newA=checkAchievements('perfect_test',c);newA.forEach(a=>{showToast(a);state.score+=a.xp})}render()}}
function submitTestResult(xp){completeItem('test',state.activeTest.id,xp);state.score+=xp;const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);if(s){s.xp+=xp;s.activitiesCompleted=(s.activitiesCompleted||0)+1;saveStudents(students)}goBackToCategory()}

function startGameTimer(){if(gameState.timer)clearInterval(gameState.timer);gameState.timer=setInterval(()=>{if(gameState.time>0&&!gameState.over){gameState.time--;const tEl=document.querySelector('[style*="var(--red)"]');render()}else if(gameState.time===0){gameState.over=true;clearInterval(gameState.timer);render()}}},1000)}
function stopGame(){if(gameState.timer)clearInterval(gameState.timer)}
function checkGameAnswer(){if(gameState.input.toUpperCase()===gameState.word){gameState.score+=100;const w=WORDS[Math.floor(Math.random()*WORDS.length)];gameState.word=w;gameState.scrambled=scramble(w);gameState.input='';render();const inp=document.getElementById('gameInput');if(inp)inp.focus()}}
function submitGameScore(xp){completeItem('game',state.activeGame.id,xp);state.score+=xp;const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);if(s){s.xp+=xp;s.gamesPlayed=(s.gamesPlayed||0)+1;s.activitiesCompleted=(s.activitiesCompleted||0)+1;saveStudents(students)}goBackToCategory()}

function submitWOTD(){const input=document.getElementById('wotdInput');const fb=document.getElementById('wotdFeedback');const wotd=WOTD[new Date().getDate()%WOTD.length];const val=input.value.trim();
  if(!val){fb.innerHTML='<div style="padding:12px;border-radius:8px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:var(--red);font-size:14px">Please write a sentence first.</div>';fb.style.display='block';return}
  if(val.toLowerCase().includes(wotd.word.toLowerCase())){const wc=val.split(/\s+/).length;if(wc>=5){fb.innerHTML='<div style="padding:12px;border-radius:8px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);color:var(--green);font-size:14px">Excellent! +20 XP 🎉</div>';fb.style.display='block';state.score+=20;const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);if(s){s.xp+=20;saveStudents(students)}const c=parseInt(localStorage.getItem(STORAGE_KEYS.wordSubs)||'0')+1;localStorage.setItem(STORAGE_KEYS.wordSubs,''+c);const newA=checkAchievements('word_submissions',c);newA.forEach(a=>{showToast(a);state.score+=a.xp});input.value=''}else{fb.innerHTML='<div style="padding:12px;border-radius:8px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:var(--red);font-size:14px">Write at least 5 words.</div>';fb.style.display='block'}}else{fb.innerHTML=`<div style="padding:12px;border-radius:8px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);color:var(--red);font-size:14px">Include "${wotd.word}" in your sentence.</div>`;fb.style.display='block'}}

function prevFact(){state.factIndex=(state.factIndex-1+FUN_FACTS.length)%FUN_FACTS.length;state.showTip=false;render()}
function nextFact(){state.factIndex=(state.factIndex+1)%FUN_FACTS.length;state.showTip=false;render()}
function setFact(i){state.factIndex=i;state.showTip=false;render()}

function showCreateForm(){const area=document.getElementById('studentFormArea');area.innerHTML=`<div style="background:var(--white);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid var(--gray-200)">
  <h4 style="margin:0 0 16px;font-size:18px">Create New Student</h4>
  <div style="display:grid;gap:16px;margin-bottom:16px">
    <div><label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500">First Name</label><input type="text" id="newFirstName" placeholder="Enter first name" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--gray-300);font-size:14px;outline:none"></div>
    <div><label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500">Surname</label><input type="text" id="newSurname" placeholder="Enter surname" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--gray-300);font-size:14px;outline:none"></div>
    <div><label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;font-weight:500"><input type="checkbox" id="autoGen" checked> Auto-generate 4-digit code</label><input type="text" id="newCode" placeholder="Enter 4-digit code" maxlength="4" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--gray-300);font-size:14px;font-family:monospace;outline:none;display:none"></div>
  </div>
  <div id="createFormError" style="display:none;background:rgba(239,68,68,.1);color:var(--red);padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:14px"></div>
  <div style="display:flex;gap:12px"><button onclick="doCreateStudent()" class="btn btn-primary btn-sm">Create Student</button><button onclick="document.getElementById('studentFormArea').innerHTML=''" class="btn btn-secondary btn-sm">Cancel</button></div>
</div>`;
  const cb=document.getElementById('autoGen'),ci=document.getElementById('newCode');
  cb.addEventListener('change',()=>{ci.style.display=cb.checked?'none':'block'})}

function doCreateStudent(){const fn=document.getElementById('newFirstName').value.trim();const sn=document.getElementById('newSurname').value.trim();const err=document.getElementById('createFormError');
  if(!fn||!sn){err.textContent='Please enter both names.';err.style.display='block';return}
  const auto=document.getElementById('autoGen').checked;const students=loadStudents();const code=auto?genCode(students):document.getElementById('newCode').value.trim();
  if(!code){err.textContent='Enter a code or enable auto-generation.';err.style.display='block';return}
  if(students.some(s=>s.code===code)){err.textContent='Code already exists.';err.style.display='block';return}
  createStudent(fn,sn,code);render()}

function editStudent(code){const s=loadStudents().find(x=>x.code===code);if(!s)return;const area=document.getElementById('studentFormArea');area.innerHTML=`<div style="background:var(--white);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid var(--gray-200)">
  <h4 style="margin:0 0 16px;font-size:18px">Edit Student</h4>
  <div style="display:grid;gap:16px;margin-bottom:16px">
    <div><label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500">First Name</label><input type="text" id="editFirstName" value="${s.firstName}" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--gray-300);font-size:14px;outline:none"></div>
    <div><label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500">Surname</label><input type="text" id="editSurname" value="${s.surname}" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid var(--gray-300);font-size:14px;outline:none"></div>
  </div>
  <div style="display:flex;gap:12px"><button onclick="doEditStudent('${code}')" class="btn btn-primary btn-sm">Update</button><button onclick="document.getElementById('studentFormArea').innerHTML=''" class="btn btn-secondary btn-sm">Cancel</button></div>
</div>`}

function doEditStudent(code){const fn=document.getElementById('editFirstName').value.trim();const sn=document.getElementById('editSurname').value.trim();if(!fn||!sn)return;updateStudent(code,{firstName:fn,surname:sn,name:`${fn} ${sn}`});render()}

function removeStudent(code){if(confirm('Delete this student? This cannot be undone.')){deleteStudent(code);render()}}

function saveProfileChanges(){const avatar=document.getElementById('profileAvatarPreview').textContent;const title=document.getElementById('profileTitlePreview').textContent;saveProfile({avatar,title});closeModal();render()}

// ==================== INIT ====================
initAchievements();
render();
</script>
</body>
</html>
