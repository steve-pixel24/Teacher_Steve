<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Steve's - Interactive Learning Platform</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --brand-orange:#E36C24;--brand-orange-hover:#C85A18;--brand-orange-light:rgba(227,108,36,0.1);
  --brand-charcoal:#1F1F1F;--brand-graphite:#2B2D31;--brand-stone:#B8BAC0;
  --brand-sand:#F4F2EE;--brand-light-sand:#FAF8F5;
  --white:#FFFFFF;--gray-100:#F3F4F6;--gray-200:#E5E7EB;--gray-300:#D1D5DB;
  --gray-400:#9CA3AF;--gray-500:#6B7280;--gray-600:#4B5563;--gray-700:#374151;--gray-800:#1F2937;
  --green:#10b981;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:var(--brand-graphite);min-height:100vh;background:var(--brand-sand)}
.font-heading{font-family:'Montserrat',sans-serif}
.font-mono{font-family:'JetBrains Mono',monospace}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideInRight{from{transform:translateX(400px);opacity:0}to{transform:translateX(0);opacity:1}}
.animate-fade-in{animation:fadeIn .4s ease-out}
.animate-slide-up{animation:slideUp .5s ease-out}

/* Header */
.header-banner{position:relative;width:100%;height:80px;overflow:hidden;background:var(--brand-charcoal);box-shadow:0 4px 6px -1px rgba(0,0,0,.1)}
.header-banner.compact{height:64px}
.header-geo-1{position:absolute;top:0;left:0;width:320px;height:100%;background:linear-gradient(135deg,#E36C24,#C85A18);clip-path:polygon(0 0,100% 0,68% 100%,0 100%);z-index:1}
.header-geo-2{position:absolute;top:0;left:180px;width:140px;height:100%;background:rgba(227,108,36,.35);clip-path:polygon(25% 0,100% 0,75% 100%,0% 100%);z-index:2}
.header-geo-3{position:absolute;top:0;left:280px;width:80px;height:100%;background:rgba(255,255,255,.1);clip-path:polygon(30% 0,100% 0,70% 100%,0% 100%);z-index:3}
.banner-line{position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--brand-orange),var(--brand-orange-hover),transparent 70%);z-index:10}
.banner-content{position:relative;z-index:20;height:100%;max-width:1280px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between}

/* Cards */
.card{background:var(--white);border:1px solid var(--gray-200);border-radius:12px;padding:24px;box-shadow:0 4px 20px -2px rgba(31,31,31,.05);transition:all .2s ease}
.card:hover{box-shadow:0 8px 30px -4px rgba(31,31,31,.1)}
.card-interactive{cursor:pointer}
.card-interactive:hover{transform:translateY(-2px);box-shadow:0 8px 30px -4px rgba(31,31,31,.1)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:'Montserrat',sans-serif;font-weight:700;border:none;border-radius:8px;cursor:pointer;transition:all .2s ease;font-size:14px;padding:12px 24px;text-transform:uppercase;letter-spacing:.05em}
.btn-primary{background:var(--brand-orange);color:var(--white);box-shadow:0 4px 6px -1px rgba(227,108,36,.2)}
.btn-primary:hover{background:var(--brand-orange-hover);transform:translateY(-1px);box-shadow:0 6px 12px -1px rgba(227,108,36,.3)}
.btn-secondary{background:var(--brand-light-sand);border:1px solid var(--gray-200);color:var(--brand-graphite)}
.btn-secondary:hover{background:var(--gray-100);border-color:var(--gray-300)}
.btn-ghost{background:transparent;color:var(--gray-500);padding:8px 16px;text-transform:none;letter-spacing:normal;font-weight:500;font-family:'Inter',sans-serif}
.btn-ghost:hover{color:var(--brand-graphite);background:rgba(255,255,255,.5)}
.btn-sm{padding:8px 16px;font-size:12px}

/* Tags */
.tag{padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:inline-block}
.tag-blue{background:rgba(59,130,246,.1);color:#3b82f6}
.tag-purple{background:rgba(139,92,246,.1);color:#8b5cf6}
.tag-green{background:rgba(16,185,129,.1);color:#10b981}
.tag-orange{background:rgba(227,108,36,.1);color:var(--brand-orange)}

/* Progress */
.progress-track{height:6px;background:var(--gray-200);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--brand-orange),var(--brand-orange-hover));transition:width .5s ease;border-radius:3px}

/* Login */
.login-card{background:var(--white);border:1px solid var(--gray-200);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:48px 40px;position:relative;overflow:hidden;max-width:448px;width:100%}
.login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:6px;background:var(--brand-orange)}
.login-input{width:100%;background:var(--brand-light-sand);border:1px solid var(--gray-300);border-radius:8px;padding:12px 16px;color:var(--brand-graphite);font-size:14px;outline:none;transition:all .2s}
.login-input:focus{border-color:var(--brand-orange);box-shadow:0 0 0 3px rgba(227,108,36,.1);background:var(--white)}
.login-btn{width:100%;background:var(--brand-orange);color:var(--white);font-family:'Montserrat',sans-serif;font-weight:700;font-size:14px;padding:14px;border:none;border-radius:8px;cursor:pointer;transition:all .2s;margin-top:8px;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 4px 6px -1px rgba(227,108,36,.2)}
.login-btn:hover:not(:disabled){background:var(--brand-orange-hover);transform:translateY(-1px)}
.login-btn:disabled{opacity:.6;cursor:not-allowed}

/* Game options */
.game-option{background:var(--white);border:2px solid var(--gray-300);border-radius:8px;padding:14px 20px;font-size:15px;color:var(--brand-graphite);cursor:pointer;transition:all .15s ease;text-align:left;width:100%;font-family:'Inter',sans-serif}
.game-option:hover:not(:disabled){border-color:var(--brand-orange);background:var(--brand-orange-light)}
.game-option:disabled{cursor:default;opacity:.7}
.game-option.correct{background:rgba(16,185,129,.1);border-color:var(--green);color:var(--green)}
.game-option.wrong{background:rgba(239,68,68,.08);border-color:var(--red);color:var(--red)}

/* Flashcards */
.flashcard-container{perspective:1000px;width:100%;max-width:400px;height:240px;margin:0 auto;cursor:pointer}
.flashcard-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flashcard-inner.flipped{transform:rotateY(180deg)}
.flashcard-front,.flashcard-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.flashcard-front{background:var(--white);border:1px solid var(--gray-200);box-shadow:0 4px 20px rgba(0,0,0,.06)}
.flashcard-back{background:linear-gradient(135deg,rgba(227,108,36,.08),rgba(255,193,7,.08));border:1px solid rgba(227,108,36,.2);box-shadow:0 4px 20px rgba(0,0,0,.06);transform:rotateY(180deg)}

/* Match items */
.match-item{padding:12px 18px;background:var(--white);border:1px solid var(--gray-200);border-radius:10px;font-size:14px;cursor:pointer;transition:all .15s ease;text-align:center;color:var(--brand-graphite)}
.match-item:hover{border-color:rgba(227,108,36,.3);background:var(--brand-light-sand)}
.match-item.selected{border-color:var(--brand-orange);background:var(--brand-orange-light);color:var(--brand-orange)}
.match-item.matched{border-color:var(--green);background:rgba(16,185,129,.1);color:var(--green);cursor:default}

/* Word chips */
.word-chip{display:inline-flex;align-items:center;padding:8px 16px;background:var(--white);border:1px solid var(--gray-200);border-radius:8px;font-size:14px;font-weight:500;cursor:grab;transition:all .15s ease;user-select:none;color:var(--brand-graphite)}
.word-chip:hover{background:var(--brand-orange-light);border-color:var(--brand-orange);color:var(--brand-orange)}
.word-chip.placed{opacity:.4;cursor:default}
.word-chip.selected{background:var(--brand-orange-light);border-color:var(--brand-orange);color:var(--brand-orange)}

/* Callouts */
.callout{border-radius:10px;padding:16px 20px;margin:16px 0;font-size:14px;line-height:1.7}
.callout-blue{background:rgba(59,130,246,.08);border:1px solid rgba(59,130,246,.2)}
.callout-blue strong{color:var(--blue)}
.callout-amber{background:var(--brand-orange-light);border:1px solid rgba(227,108,36,.2)}
.callout-amber strong{color:var(--brand-orange)}
.callout-green{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2)}
.callout-green strong{color:var(--green)}
.callout-purple{background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2)}
.callout-purple strong{color:var(--purple)}

/* Tables */
.lesson-table{width:100%;border-collapse:separate;border-spacing:0;margin:16px 0;font-size:14px;overflow:hidden;border-radius:10px;border:1px solid var(--gray-200);background:var(--white)}
.lesson-table th{text-align:left;padding:12px 16px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--gray-500);background:var(--brand-light-sand);border-bottom:1px solid var(--gray-200)}
.lesson-table td{padding:12px 16px;border-bottom:1px solid rgba(0,0,0,.04);line-height:1.5;color:var(--brand-graphite)}
.lesson-table tr:last-child td{border-bottom:none}
.lesson-table tr:hover td{background:rgba(227,108,36,.03)}

/* Story box */
.story-box{background:var(--brand-light-sand);border-left:3px solid var(--brand-orange);border-radius:0 12px 12px 0;padding:24px 28px;margin:16px 0;font-size:15px;line-height:1.9;color:var(--brand-graphite)}
.story-box em{font-style:normal;color:var(--brand-orange);font-weight:500;background:rgba(227,108,36,.08);padding:2px 6px;border-radius:4px}

/* Streak */
.streak-fire{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:linear-gradient(135deg,rgba(227,108,36,.15),rgba(255,193,7,.15));border:1px solid rgba(227,108,36,.25);border-radius:20px;font-size:12px;font-weight:600;color:var(--brand-orange)}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal-content{background:var(--white);border-radius:16px;max-width:600px;width:100%;max-height:80vh;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.3)}
.modal-header{background:linear-gradient(135deg,rgba(227,108,36,.1),rgba(255,193,7,.1));padding:24px;border-bottom:1px solid var(--gray-200)}
.modal-body{overflow:auto;padding:24px;max-height:60vh}

/* Toast */
.toast{position:fixed;top:100px;right:24px;background:var(--white);border:2px solid var(--green);border-radius:12px;padding:16px 20px;box-shadow:0 12px 40px rgba(0,0,0,.15);z-index:2000;display:flex;align-items:center;gap:12px;animation:slideInRight .4s ease-out;max-width:400px}

/* Category tile */
.category-tile{background:var(--white);border:1px solid var(--gray-200);border-radius:12px;padding:20px;cursor:pointer;transition:all .2s;text-align:left}
.category-tile:hover{border-color:var(--brand-orange);transform:translateY(-2px);box-shadow:0 8px 24px rgba(227,108,36,.1)}

/* Header buttons */
.header-btn{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;font-size:13px;color:rgba(255,255,255,.9);cursor:pointer;font-weight:500;transition:all .2s;font-family:'Inter',sans-serif}
.header-btn:hover{background:rgba(255,255,255,.15);color:#fff}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--brand-stone);border-radius:4px}

.hidden{display:none!important}

@media(max-width:640px){
  .card{padding:18px}
  .flashcard-container{height:200px}
  .header-banner{height:64px}
  .banner-content{padding:0 12px}
  .hide-mobile{display:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ==================== DATA ====================
const ADMIN_NAME='steve',ADMIN_CODE='2324';
const STORAGE_KEYS={students:'tss_students',progress:'tss_progress',achievements:'tss_achievements',streak:'tss_streak',wordSubs:'tss_word_subs',perfectTests:'tss_perfect',profile:'tss_profile'};

// Lessons
const lessons=[
  {id:'conditionals-b2',title:'Conditionals, Probability & Modal Verbs',description:'Master conditional types and probability expressions.',level:'B2',type:'Grammar',duration:50,icon:'🔀',
    sections:[
      {id:'c1',title:'Conditionals — Degrees of Reality',type:'content',duration:15,content:{subtitle:'The conditional type tells the listener how seriously you believe the situation could happen.',blocks:[
        {type:'table',headers:['Type','Formula','Reality Level','Example'],rows:[['Zero','If + present → present','Always true','If you heat ice, it melts.'],['First','If + present → will','Real & possible',"If I get the job, I'll move."],['Second','If + past → would','Unlikely / imaginary',"If I won the lottery, I'd retire."],['Third','If + past perfect → would have','Impossible — past regret','If I had studied, I would have passed.']]},
        {type:'callout',variant:'amber',content:'<strong>Compare:</strong><br><strong>First:</strong> "If it rains, I\'ll take an umbrella." → I think it might rain.<br><strong>Second:</strong> "If it rained, I\'d take an umbrella." → Probably won\'t rain.'}
      ]}},
      {id:'c2',title:'Test Your Knowledge',type:'quiz',duration:10,quiz:{questions:[
        {question:"_____ I had more time, I would learn Japanese.",options:["If","When","Unless","Although"],answer:0,explanation:"'If' introduces the second conditional."},
        {question:"You _____ have told me about the meeting!",options:["could","should","might","would"],answer:1,explanation:"'Should have' expresses criticism."},
        {question:"There's a chance the flight _____ be delayed.",options:["will","should","might","must"],answer:2,explanation:"'Might' expresses uncertainty."},
        {question:"If water reaches 100°C, it _____.",options:["would boil","will boil","boils","boiled"],answer:2,explanation:"Zero conditional uses present simple."}
      ]}},
      {id:'c3',title:'Discussion Practice',type:'discussion',duration:10,discussion:{questions:["Make a First Conditional about your plans this week.","Make a Second Conditional — something unlikely but fun.","Make a Third Conditional — something you regret."],tips:["Focus on meaning, not just form","Use different conditional types"]}}
    ]},
  {id:'phrasal-verbs-b2',title:'Essential Phrasal Verbs',description:'Learn common phrasal verbs with context.',level:'B2',type:'Vocabulary',duration:45,icon:'📚',
    sections:[
      {id:'pv1',title:'Learn the Phrasal Verbs',type:'flashcards',duration:15,flashcards:{cards:[
        {front:'come up with',back:'to think of / create an idea',example:"She came up with a solution."},
        {front:'look forward to',back:'to feel excited about the future',example:"I'm looking forward to the weekend."},
        {front:'put off',back:'to postpone / delay',example:"Stop putting off your homework!"},
        {front:'figure out',back:'to understand or solve',example:"I can't figure out this app."},
        {front:'run out of',back:'to have no more left',example:"We've run out of milk."}
      ]}},
      {id:'pv2',title:'Match the Meaning',type:'matching',duration:10,matching:{instruction:'Match each phrasal verb with its meaning',pairs:[{left:'come up with',right:'create an idea'},{left:'put off',right:'postpone'},{left:'figure out',right:'solve / understand'},{left:'run out of',right:'have none left'}]}},
      {id:'pv3',title:'Use Them in Context',type:'discussion',duration:10,discussion:{questions:["Tell me about a creative solution you came up with.","What are you looking forward to?"]}}
    ]},
  {id:'job-interview-b2',title:'Job Interview English',description:'Prepare for English job interviews.',level:'B2',type:'Conversation',duration:50,icon:'💼',
    sections:[
      {id:'ji1',title:'Key Interview Phrases',type:'content',duration:15,content:{subtitle:'Professional phrases for English interviews.',blocks:[
        {type:'callout',variant:'green',content:'<strong>STAR Method:</strong><br>• <strong>S</strong>ituation — set the scene<br>• <strong>T</strong>ask — what was required<br>• <strong>A</strong>ction — what YOU did<br>• <strong>R</strong>esult — the outcome'},
        {type:'callout',variant:'blue',content:'<strong>Power phrases:</strong><br>• "In my previous role, I was responsible for..."<br>• "One achievement I\'m proud of is..."<br>• "I\'m passionate about..."'}
      ]}},
      {id:'ji2',title:'Choose the Best Response',type:'quiz',duration:10,quiz:{questions:[
        {question:"Interviewer: 'Tell me about yourself.' Best response:",options:["My name is Juan.","I'm a developer with 5 years of experience in full-stack.","I like football.","I need a job."],answer:1,explanation:"Focus on relevant experience and skills."},
        {question:"'What's your biggest weakness?' Best approach:",options:["I don't have any.","I work too hard.","I struggle with public speaking, but I've been taking courses.","Why do you want to know?"],answer:2,explanation:"Show self-awareness and improvement."}
      ]}},
      {id:'ji3',title:'Role Play Practice',type:'discussion',duration:20,discussion:{questions:["🎭 'Tell me about yourself.'","🎭 'Describe a challenging situation at work.'","🎭 'Where do you see yourself in 5 years?'","🎭 'Do you have any questions for us?'"],tips:["Speak slowly and clearly","Use pauses naturally","Ask for clarification if needed"]}}
    ]},
  {id:'linking-words-b1',title:'Linking Words & Connectors',description:'Connect ideas smoothly with linking words.',level:'B1',type:'Grammar',duration:45,icon:'🔗',
    sections:[
      {id:'lw1',title:'Categories of Connectors',type:'content',duration:15,content:{subtitle:'Linking words help your ideas flow.',blocks:[
        {type:'table',headers:['Function','Connectors','Example'],rows:[['Adding','also, moreover, furthermore','I love cooking. Moreover, I enjoy baking.'],['Contrasting','however, although, on the other hand',"Although it rained, we went out."],['Cause/Effect','because, therefore, as a result',"It rained. As a result, the match was cancelled."],['Sequencing','first, then, finally, meanwhile','First, preheat the oven. Then, mix ingredients.']]},
        {type:'callout',variant:'amber',content:"<strong>Common mistake:</strong> Don't overuse connectors! One or two per paragraph is enough."}
      ]}},
      {id:'lw2',title:'Choose the Right Connector',type:'quiz',duration:10,quiz:{questions:[
        {question:"The restaurant was expensive. _____, the food was amazing.",options:["Because","However","Therefore","For example"],answer:1,explanation:"'However' shows contrast."},
        {question:"She studied hard. _____, she passed with flying colors.",options:["Although","However","As a result","For instance"],answer:2,explanation:"'As a result' shows the effect."}
      ]}},
      {id:'lw3',title:'Practice in Conversation',type:'discussion',duration:10,discussion:{questions:["Tell me about your last vacation using 3 linking words.","Describe your daily routine using sequencing words.","Compare city life and country life using contrast connectors."]}}
    ]},
  {id:'past-tenses-b1',title:'Past Tenses — Telling Stories',description:'Master past simple, continuous, and perfect.',level:'B1',type:'Grammar',duration:50,icon:'⏰',
    sections:[
      {id:'pt1',title:'The Three Past Tenses',type:'content',duration:15,content:{subtitle:'Each past tense paints a different picture of time.',blocks:[
        {type:'table',headers:['Tense','Form','Use','Example'],rows:[['Past Simple','verb + ed','Completed action','I arrived at 8pm.'],['Past Continuous','was/were + verb-ing','Action in progress','I was cooking when she called.'],['Past Perfect','had + past participle','Before another past action','I had eaten when they arrived.']]},
        {type:'callout',variant:'blue',content:'<strong>Timeline trick:</strong><br>• Past Perfect → happened FIRST<br>• Past Continuous → was IN PROGRESS<br>• Past Simple → happened AT THAT MOMENT'}
      ]}},
      {id:'pt2',title:'Test Your Understanding',type:'quiz',duration:10,quiz:{questions:[
        {question:"When I arrived, they _____ dinner.",options:["cooked","were cooking","had cooked"],answer:1,explanation:"Past continuous — action in progress."},
        {question:"She _____ to Paris three times before she moved.",options:["traveled","was traveling","had traveled"],answer:2,explanation:"Past perfect — before she moved."},
        {question:"I _____ TV when the phone rang.",options:["watched","was watching","had watched"],answer:1,explanation:"Past continuous with 'when'."}
      ]}},
      {id:'pt3',title:'Tell Your Story',type:'discussion',duration:10,discussion:{questions:["Tell me about the best vacation you ever had using all three past tenses.","Describe a time something unexpected happened.","Describe your morning today."],tips:["Start with past continuous to set the scene","Use past simple for main events","Use past perfect for earlier events"]}}
    ]}
];

// Stories
const stories=[
  {id:'warframe-lotus',title:"The Lotus's Whisper",level:'B2',readTime:8,summary:'A sci-fi tale set in the Warframe universe.',genre:'Sci-Fi / Gaming',
    content:`In the depths of the Origin System, the Lotus spoke in riddles. Her voice echoed through the comms, guiding the Tenno through the darkness.\n\n"You are not what you were," she whispered. "You are what you will become."\n\nThe Warframe moved through the corridors of the derelict ship, its movements fluid and precise. Each step carried the weight of centuries — of Orokin ambition and collapse.\n\n"Remember," the Lotus continued, "the void is not your enemy. It is your teacher."\n\nOutside, the stars burned cold and distant. The Tenno paused, sensing something ahead — a presence, ancient and powerful.\n\n"They are waiting for you," the Lotus said. "But you were built for this. You were built to endure."\n\nThe Warframe raised its weapon and stepped forward into the unknown.`},
  {id:'travel-tokyo',title:'Lost in Tokyo',level:'B1',readTime:6,summary:"A traveler's adventure through Tokyo.",genre:'Travel',
    content:`The neon lights of Shibuya crossing blurred together as Mark checked his map for the third time. He was hopelessly lost.\n\n"Sumimasen!" he called to a passing woman. "Where is the train station?"\n\nShe smiled warmly and pointed down a narrow alley. "Two blocks, then turn left at the vending machines."\n\nMark thanked her and walked. The alley was alive with sound — the clatter of dishes from a tiny ramen shop, the electronic jingle of a pachinko parlor, the soft hum of conversation from a salaryman lighting a cigarette.\n\nHe found the station, but instead of going home, he followed a sign for a festival he didn't know existed. Paper lanterns lined the street, and the smell of yakitori filled the air.\n\nSometimes, being lost is the best way to be found.`},
  {id:'mystery-library',title:'The Midnight Library',level:'B2',readTime:10,summary:'A mysterious library that appears only at midnight.',genre:'Mystery / Fantasy',
    content:`When the clock struck twelve, the old library doors creaked open. Sarah had waited outside for an hour, rain soaking through her coat.\n\nInside, the library was impossible. Shelves stretched upward into darkness, and the books seemed to glow with their own light.\n\n"Welcome," said a voice. An old man stood behind the desk, though Sarah was certain he hadn't been there a moment ago. "Each book contains a life you could have lived. Choose carefully."\n\nSarah reached for a blue spine. The moment her fingers touched it, she saw herself — older, happier, standing on a beach she'd never visited. A life she'd almost chosen, once.\n\n"You can read as long as you like," the old man said. "But you can only take one story home."\n\nSarah smiled. She had all night.`},
  {id:'tech-startup',title:'Code & Coffee',level:'B1',readTime:7,summary:'A startup founder building their dream app.',genre:'Technology / Business',
    content:`Sarah stared at her laptop screen, the code finally compiling after hours of debugging. The café was empty now — just her and the bartender, who'd long since stopped asking if she wanted another coffee.\n\n"Ship it," she whispered to herself.\n\nShe pressed deploy. The progress bar crawled forward. 50%... 75%... 100%.\n\nHer app was live. Three years of evenings and weekends, of rejected ideas and failed prototypes, had led to this moment.\n\nThe first notification came within seconds. A user. Then another. Then ten more.\n\nBy morning, she had a thousand users and a message from an investor who wanted to talk.\n\nShe closed her laptop, finally drank the cold coffee, and walked home through the sunrise. The hard part, she knew, was just beginning.`},
  {id:'cooking-disaster',title:'The Great Bake-Off',level:'A2',readTime:5,summary:'A cooking competition goes hilariously wrong.',genre:'Comedy / Lifestyle',
    content:`Everything was going perfectly until Jamie accidentally grabbed salt instead of sugar.\n\nThe judges were watching. The cameras were rolling. And Jamie was about to present a cake that tasted like the sea.\n\n"It's a... savory sponge," Jamie said quickly, smiling through pure panic. "Inspired by Mediterranean flavors."\n\nThe judges exchanged glances. One of them took a bite. Chewed. Swallowed.\n\n"Interesting," she said carefully.\n\nJamie's partner, Mia, kicked him under the table. "What he means is, it's experimental," she said smoothly. "We're pushing boundaries."\n\nThey didn't win. But they got a standing ovation, and the clip went viral. Sometimes the best moments are the ones you didn't plan.`}

// ==================== STORAGE HELPERS ====================
function ls(key,val){if(val===undefined){try{return JSON.parse(localStorage.getItem(key))}catch{return null}}localStorage.setItem(key,JSON.stringify(val))}
function loadStudents(){return ls(STORAGE_KEYS.students)||[]}
function saveStudents(s){ls(STORAGE_KEYS.students,s)}
function loadProgress(){return ls(STORAGE_KEYS.progress)||[]}
function saveProgress(p){ls(STORAGE_KEYS.progress,p)}
function loadAchievements(){return ls(STORAGE_KEYS.achievements)||null}
function saveAchievements(a){ls(STORAGE_KEYS.achievements,a)}

function genCode(students){const codes=new Set(students.map(s=>s.code));let c;do{c=''+(1000+Math.floor(Math.random()*9000))}while(codes.has(c));return c}
function createStudent(fn,sn,code){const students=loadStudents();const s={firstName:fn,surname:sn,name:`${fn} ${sn}`,code,xp:0,level:1,activitiesCompleted:0,lessonsCompleted:0,storiesRead:0,gamesPlayed:0};students.push(s);saveStudents(students);return s}
function updateStudent(code,updates){const students=loadStudents();const u=students.map(s=>s.code===code?{...s,...updates}:s);saveStudents(u);return u}
function deleteStudent(code){const students=loadStudents().filter(s=>s.code!==code);saveStudents(students);return students}

// Progress
function getItemProgress(type,id){return loadProgress().find(p=>p.type===type&&p.id===id)||null}
function updateProgress(type,id,updates){const p=loadProgress();const ex=p.find(x=>x.type===type&&x.id===id);if(ex)Object.assign(ex,updates,{lastAccessedAt:new Date().toISOString()});else p.push({id,type,status:'not-started',progress:0,xpEarned:0,lastAccessedAt:new Date().toISOString(),...updates});saveProgress(p)}
function completeItem(type,id,xp){updateProgress(type,id,{status:'completed',progress:100,xpEarned:xp,completedAt:new Date().toISOString()})}
function getTotalXP(){return loadProgress().reduce((s,i)=>s+i.xpEarned,0)}

// Level system
const LEVELS=[{l:1,min:0,max:100},{l:2,min:101,max:250},{l:3,min:251,max:500},{l:4,min:501,max:800},{l:5,min:801,max:1200},{l:6,min:1201,max:1700},{l:7,min:1701,max:2300},{l:8,min:2301,max:3000},{l:9,min:3001,max:3800},{l:10,min:3801,max:5000}];
function getLevelInfo(xp){for(let i=LEVELS.length-1;i>=0;i--)if(xp>=LEVELS[i].min){const t=LEVELS[i];return{level:t.level,currentXP:xp-t.min,maxXP:t.max-t.min,progress:Math.min(((xp-t.min)/(t.max-t.min))*100,100)}};return{level:1,currentXP:xp,maxXP:100,progress:0}}
function getLevelColor(l){if(l>=8)return'#FFD700';if(l>=5)return'#C0C0C0';if(l>=3)return'#CD7F32';return'#64748B'}

function getDifficultyColor(difficulty){
  switch(difficulty){
    case 'A1':return'#10b981';
    case 'A2':return'#3b82f6';
    case 'B1':return'#f59e0b';
    case 'B2':return'#f97316';
    case 'C1':return'#ef4444';
    default:return'#6b7280';
  }
}

function toggleWOTDDetails(){
  wotdDetailsVisible=!wotdDetailsVisible;
  const details=document.getElementById('wotdDetails');
  const btn=document.getElementById('wotdDetailsBtn');
  if(details){
    details.style.display=wotdDetailsVisible?'block':'none';
    btn.querySelector('span:first-child').textContent=wotdDetailsVisible?'Hide More Details':'Show More Details';
    btn.querySelector('span:last-child').textContent=wotdDetailsVisible?'▲':'▼';
  }
}

function toggleWOTDLearned(){
  wotdLearned=!wotdLearned;
  const btn=document.getElementById('wotdLearnedBtn');
  if(btn){
    if(wotdLearned){
      btn.style.background='rgba(16,185,129,.1)';
      btn.style.borderColor='rgba(16,185,129,.3)';
      btn.style.color='#10b981';
      btn.textContent='✓ Learned (+5 XP)';
      if(!btn.dataset.xpGiven){
        state.score+=5;
        const students=loadStudents();
        const s=students.find(x=>x.code===state.studentCode);
        if(s){s.xp+=5;saveStudents(students)}
        btn.dataset.xpGiven='true';
      }
    }else{
      btn.style.background='transparent';
      btn.style.borderColor='rgba(107,114,128,.2)';
      btn.style.color='#6B7280';
      btn.textContent='Mark as Learned';
    }
  }
}

// Achievements
function initAchievements(){if(!loadAchievements())saveAchievements(ACHIEVEMENT_DEFS.map(a=>({...a,current:0,unlocked:false})));return loadAchievements()}
function checkAchievements(type,value){const achs=initAchievements();const newUn=[];achs.forEach(a=>{if(!a.unlocked&&a.type===type){a.current=value;if(value>=a.target){a.unlocked=true;a.unlockedAt=new Date().toISOString();newUn.push(a)}}});saveAchievements(achs);return newUn}

// Login streak
function trackLoginStreak(){const today=new Date().toDateString();const data=ls(STORAGE_KEYS.streak);let streak=0;if(data){const y=new Date();y.setDate(y.getDate()-1);if(data.lastLogin===today)return data.streak;else if(data.lastLogin===y.toDateString())streak=data.streak+1;else streak=1}else streak=1;ls(STORAGE_KEYS.streak,{lastLogin:today,streak});checkAchievements('login_streak',streak);return streak}

function getCategoryColor(category){
  switch(category){
    case 'vocabulary':return{bg:'rgba(139,92,246,.1)',border:'rgba(139,92,246,.3)',text:'#8b5cf6'};
    case 'grammar':return{bg:'rgba(59,130,246,.1)',border:'rgba(59,130,246,.3)',text:'#3b82f6'};
    case 'culture':return{bg:'rgba(16,185,129,.1)',border:'rgba(16,185,129,.3)',text:'#10b981'};
    case 'history':return{bg:'rgba(245,158,11,.1)',border:'rgba(245,158,11,.3)',text:'#f59e0b'};
    case 'fun':return{bg:'rgba(236,72,153,.1)',border:'rgba(236,72,153,.3)',text:'#ec4899'};
    default:return{bg:'rgba(107,114,128,.1)',border:'rgba(107,114,128,.3)',text:'#6b7280'};
  }
}

function getDifficultyColor(difficulty){
  switch(difficulty){
    case 'A1':return'#10b981';
    case 'A2':return'#3b82f6';
    case 'B1':return'#f59e0b';
    case 'B2':return'#f97316';
    case 'C1':return'#ef4444';
    default:return'#6b7280';
  }
}

function toggleTip(){

// ==================== RENDER ====================
function render(){
  const app=document.getElementById('app');
  if(state.view==='login')app.innerHTML=renderLogin();
  else if(state.view==='home')app.innerHTML=renderHome();
  else if(state.view==='category')app.innerHTML=renderCategory();
  else if(state.view==='vocabulary')app.innerHTML=renderCategory();
  else if(state.view==='vocabPractice')app.innerHTML=renderVocabPractice();
  else if(state.view==='lesson')app.innerHTML=renderLessonView();
  else if(state.view==='story')app.innerHTML=renderStoryView();
  else if(state.view==='test')app.innerHTML=renderTestView();
  else if(state.view==='game')app.innerHTML=renderGameView();
  attachEvents();
}

          </div>
        </div>

        <div style="background:rgba(255,255,255,.6);border-radius:16px;padding:24px;border:1px solid rgba(227,108,36,.1)">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
            <label style="font-size:15px;font-weight:600;color:#1F1F1F;margin:0">✍️ Your Turn: Write a sentence using "${wotd.word}"</label>
            <button onclick="toggleWOTDLearned()" id="wotdLearnedBtn" style="background:transparent;border:1px solid rgba(107,114,128,.2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;color:#6B7280;cursor:pointer;transition:all .2s">Mark as Learned</button>
          </div>

          <textarea id="wotdInput" placeholder="Type your sentence here..." style="width:100%;min-height:120px;padding:16px 20px;background:rgba(255,255,255,.9);border:1px solid rgba(148,163,184,.2);border-radius:12px;color:#1F1F1F;font-size:15px;line-height:1.6;font-family:Inter,sans-serif;resize:vertical;outline:none;transition:all .2s"></textarea>
          
          <div id="wotdFeedback" style="display:none;margin-top:12px"></div>
          
          <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap">
            <button onclick="submitWOTD()" class="btn btn-primary" style="flex:1">Submit Example (+10 XP)</button>
            <button onclick="clearWOTD()" class="btn btn-secondary" style="min-width:100px">Clear</button>
          </div>

          <p style="font-size:12px;color:#9CA3AF;margin:12px 0 0;font-style:italic;text-align:center">💡 Earn 10 XP for correct sentences + 5 XP for marking as learned</p>

    ${state.isAdmin?renderAdminPanel():''}

}

function renderAdminPanel(){
  const students=loadStudents();
  return`<div style="padding:0 24px 48px"><div style="max-width:1200px;margin:0 auto">
    <div class="card" style="border:1px solid rgba(227,108,36,.2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">

      </div>
      <div id="studentFormArea"></div>
      ${students.length===0?`<div style="text-align:center;padding:40px;color:var(--gray-500)"><div style="font-size:48px;margin-bottom:12px">📚</div><p>No students yet. Click "Create Student" to begin!</p></div>`:
      `<div style="overflow-x:auto"><table class="lesson-table"><thead><tr><th>Name</th><th>Code</th><th>Level</th><th>XP</th><th>Activities</th><th style="text-align:right">Actions</th></tr></thead><tbody>
        ${students.map(s=>{const li=getLevelInfo(s.xp);const lc=getLevelColor(li.level);return`<tr>

          <td class="font-mono" style="font-size:13px">${s.code}</td>
          <td><span style="display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;background:${lc}20;color:${lc}">Level ${li.level}</span></td>
          <td>${s.xp} XP</td>
          <td>${s.activitiesCompleted}</td>
          <td style="text-align:right"><button onclick="editStudent('${s.code}')" style="background:rgba(59,130,246,.1);color:var(--blue);border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;margin-right:8px">Edit</button><button onclick="removeStudent('${s.code}')" style="background:rgba(239,68,68,.1);color:var(--red);border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer">Delete</button></td>
        </tr>`}).join('')}
      </tbody></table></div>`}

// ==================== CATEGORY GRID ====================
function renderCategory(){
  const cat=state.activeCategory;
  const config={lessons:{icon:'📖',title:'Lessons'},vocabulary:{icon:'📝',title:'Vocabulary'},stories:{icon:'📚',title:'Stories'},tests:{icon:'📝',title:'Tests'},games:{icon:'🎮',title:'Games'}}[cat];
  let tiles='';

  if(cat==='lessons'){
    tiles=lessons.map(l=>{const p=getItemProgress('lesson',l.id);const done=p&&p.status==='completed';const prog=p&&p.status==='in-progress';return`
      <div class="category-tile" onclick="openLesson('${l.id}')" style="position:relative">
        ${done?'<div style="position:absolute;top:12px;right:12px;background:var(--green);color:white;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700">✅ Done</div>':''}
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
          <span style="font-size:32px">${l.icon}</span>
          <div style="display:flex;gap:6px"><span class="tag tag-blue">${l.level}</span><span class="tag tag-purple">${l.type}</span></div>
        </div>
        <h3 class="font-heading" style="font-size:16px;font-weight:700;color:var(--brand-charcoal);margin:0 0 6px">${l.title}</h3>
        <p style="font-size:13px;color:var(--gray-500);margin:0 0 12px;line-height:1.5">${l.description}</p>
        ${prog&&!done?`<div class="progress-track" style="margin-bottom:12px"><div class="progress-fill" style="width:${p.progress}%"></div></div><span style="font-size:11px;color:var(--gray-500)">${p.progress}% Complete</span>`:''}
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--gray-100)">
          <span style="font-size:12px;color:var(--gray-500)">⏱️ ${l.duration} min</span>
          <span class="btn btn-primary btn-sm">${done?'Review →':prog?'Continue →':'Start →'}</span>
        </div>
      </div>`}).join('');
  }else if(cat==='vocabulary'){
    const grouped=Object.entries(vocabParentCategories).map(([key,info])=>({
      ...info,
      subcategories:vocabSubcategories.filter(s=>s.parentCategory===key)
    }));
    tiles=grouped.map(group=>group.subcategories.length>0?`
      <div style="margin-bottom:40px">
        <h2 class="font-heading" style="font-size:20px;font-weight:700;color:var(--brand-charcoal);margin-bottom:16px;display:flex;align-items:center;gap:12px">
          <span style="font-size:28px">${group.icon}</span>${group.title}
        </h2>
        <p style="font-size:14px;color:var(--gray-500);margin-bottom:20px">${group.description}</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px">
          ${group.subcategories.map(sub=>{
            const p=getItemProgress('vocabulary',sub.id);
            const done=p&&p.status==='completed';
            return`<div class="category-tile" onclick="openVocabSubcategory('${sub.id}')" style="position:relative">
              ${done?'<div style="position:absolute;top:12px;right:12px;background:var(--green);color:white;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700">✅ Done</div>':''}
              <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
                <span style="font-size:32px">${sub.icon}</span>
                <div>
                  <h3 class="font-heading" style="font-size:16px;font-weight:700;color:var(--brand-charcoal);margin:0">${sub.title}</h3>
                  <span class="tag tag-blue" style="font-size:10px;margin-top:4px">${sub.level}</span>
                </div>
              </div>
              <p style="font-size:13px;color:var(--gray-500);margin:0 0 12px;line-height:1.5">${sub.description}</p>
              <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--gray-100)">
                <span style="font-size:12px;color:var(--gray-500)">${sub.wordCount} words</span>
                <span class="btn btn-primary btn-sm">${done?'Review →':'Start Learning →'}</span>
              </div>
            </div>`}).join('')}
        </div>
      </div>
    `:'').join('');
  }else if(cat==='stories'){
    tiles=stories.map(s=>{const p=getItemProgress('story',s.id);const done=p&&p.status==='completed';return`
      <div class="category-tile" onclick="openStory('${s.id}')" style="position:relative">
        ${done?'<div style="position:absolute;top:12px;right:12px;background:var(--green);color:white;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700">✅ Done</div>':''}
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
          <span style="font-size:32px">📖</span>
          <div style="display:flex;gap:6px"><span class="tag tag-blue">${s.level}</span><span class="tag tag-green">${s.genre}</span></div>
        </div>
        <h3 class="font-heading" style="font-size:16px;font-weight:700;color:var(--brand-charcoal);margin:0 0 6px">${s.title}</h3>
        <p style="font-size:13px;color:var(--gray-500);margin:0 0 12px;line-height:1.5">${s.summary}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--gray-100)">
          <span style="font-size:12px;color:var(--gray-500)">⏱️ ${s.readTime} min read</span>
          <span class="btn btn-primary btn-sm">${done?'Read Again →':'Read Story →'}</span>
        </div>
      </div>`}).join('');
  }else if(cat==='tests'){
    tiles=tests.map(t=>{const p=getItemProgress('test',t.id);const done=p&&p.status==='completed';return`
      <div class="category-tile" onclick="openTest('${t.id}')" style="position:relative">
        ${done?'<div style="position:absolute;top:12px;right:12px;background:var(--green);color:white;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700">✅ Done</div>':''}
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
          <span style="font-size:32px">📝</span>
          <div style="display:flex;gap:6px"><span class="tag tag-blue">${t.difficulty}</span><span class="tag tag-purple">${t.category}</span></div>
        </div>
        <h3 class="font-heading" style="font-size:16px;font-weight:700;color:var(--brand-charcoal);margin:0 0 6px">${t.title}</h3>
        <p style="font-size:13px;color:var(--gray-500);margin:0 0 12px;line-height:1.5">${t.description}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--gray-100)">
          <div style="display:flex;gap:12px;font-size:12px;color:var(--gray-500)"><span>❓ ${t.questionCount}</span><span>⭐ ${t.xpReward} XP</span></div>
          <span class="btn btn-primary btn-sm">${done?'Retake →':'Take Test →'}</span>
        </div>
      </div>`}).join('');
  }else if(cat==='games'){
    tiles=games.map(g=>{const p=getItemProgress('game',g.id);const done=p&&p.status==='completed';return`
      <div class="category-tile" onclick="openGame('${g.id}')" style="position:relative">
        ${done?'<div style="position:absolute;top:12px;right:12px;background:var(--green);color:white;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:700">✅ Done</div>':''}
        <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
          <span style="font-size:32px">${g.icon}</span>
          <span class="tag tag-purple">${g.category}</span>
        </div>
        <h3 class="font-heading" style="font-size:16px;font-weight:700;color:var(--brand-charcoal);margin:0 0 6px">${g.title}</h3>
        <p style="font-size:13px;color:var(--gray-500);margin:0 0 12px;line-height:1.5">${g.description}</p>
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--gray-100)">
          ${g.highScore?`<span style="font-size:12px;color:var(--brand-orange);font-weight:600">🏆 ${g.highScore}</span>`:'<span></span>'}
          <span class="btn btn-primary btn-sm">${done?'Play Again →':'Play →'}</span>
        </div>
      </div>`}).join('');
  }

  return`<div style="min-height:100vh">
    ${bannerHTML(`<button onclick="openModal('dictionary')" class="header-btn hide-mobile">📖 Dictionary</button><button onclick="openModal('achievements')" class="header-btn hide-mobile">🏆 Achievements</button><button onclick="openModal('profile')" class="header-btn" style="font-size:20px">${loadProfile().avatar}</button><button onclick="goHome()" class="header-btn">← Dashboard</button>`)}
    <div style="max-width:1200px;margin:0 auto;padding:32px 24px">
      <div style="display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--gray-200)">
        <button onclick="goHome()" class="btn btn-secondary btn-sm">← Back to Dashboard</button>
        <h2 class="font-heading" style="font-size:24px;font-weight:800;color:var(--brand-charcoal);margin:0;display:flex;align-items:center;gap:12px"><span style="color:var(--brand-orange)">${config.icon}</span> ${config.title}</h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:24px">${tiles}</div>
    </div>
  </div>`;
}

// ==================== VOCABULARY PRACTICE VIEW ====================
function renderVocabPractice(){
  const sub=state.activeVocabSubcategory;
  if(!sub)return'';
  const vps=vocabPracticeState;
  const currentWord=sub.words[vps.wordIndex];
  
  let content='';
  
  if(vps.mode==='learn'){
    content=`
      <div class="card" style="text-align:center;padding:48px">
        <div style="margin-bottom:24px"><span style="font-size:12px;color:var(--gray-500)">Word ${vps.wordIndex+1} of ${sub.words.length}</span></div>
        <h2 class="font-heading" style="font-size:36px;font-weight:800;color:var(--brand-charcoal);margin-bottom:8px">${currentWord.word}</h2>
        <p class="font-mono" style="font-size:14px;color:var(--gray-400);margin-bottom:16px">${currentWord.phonetic}</p>
        <span class="tag tag-blue" style="margin-bottom:24px">${currentWord.pos}</span>
        ${vps.showDefinition?`
          <div style="margin-top:24px;text-align:left">
            <div style="background:var(--brand-light-sand);padding:20px;border-radius:12px;margin-bottom:16px">
              <p style="font-size:16px;color:var(--brand-charcoal);margin-bottom:12px"><strong>Definition:</strong> ${currentWord.definition}</p>
              <p style="font-size:14px;color:var(--gray-600);font-style:italic">"${currentWord.example}"</p>
              ${currentWord.synonyms.length>0?`<div style="margin-top:12px"><span style="font-size:13px;font-weight:600;color:var(--brand-charcoal)">Synonyms: </span><span style="font-size:13px;color:var(--gray-600)">${currentWord.synonyms.join(', ')}</span></div>`:''}
              ${currentWord.uk&&currentWord.us?`<div style="margin-top:12px;display:flex;gap:12px"><span style="font-size:13px">🇬🇧 ${currentWord.uk}</span><span style="font-size:13px">🇺🇸 ${currentWord.us}</span></div>`:''}
            </div>
          </div>
        `:`<button onclick="vocabPracticeState.showDefinition=true;render()" class="btn btn-primary" style="margin-top:24px">Show Definition</button>`}
        <div style="margin-top:32px;display:flex;justify-content:center;gap:12px">
          <button onclick="vocabPrev()" class="btn btn-secondary" ${vps.wordIndex===0?'disabled style="opacity:.5"':''}>← Previous</button>
          <button onclick="vocabNext()" class="btn btn-primary" ${vps.wordIndex===sub.words.length-1?'disabled style="opacity:.5"':''}>Next →</button>
        </div>
      </div>
    `;
  }else if(vps.mode==='quiz'){
    content=`
      <h3 class="font-heading" style="font-size:20px;font-weight:700;color:var(--brand-charcoal);margin-bottom:24px">Match the word with its definition</h3>
      <div style="display:flex;flex-direction:column;gap:24px">
        ${sub.words.map((word,wordIndex)=>{
          const options=generateVocabQuizOptions(word,sub.words);
          return`<div class="card" style="padding:20px">
            <h4 style="font-size:18px;font-weight:700;color:var(--brand-charcoal);margin-bottom:12px">${word.word}</h4>
            <div style="display:flex;flex-direction:column;gap:8px">
              ${options.map((opt,optIndex)=>`<button onclick="vocabQuizAnswer(${wordIndex},${optIndex})" ${vps.quizSubmitted?'disabled':''} style="padding:12px 16px;background:${vps.quizSubmitted?(opt===word.definition?'rgba(16,185,129,.1)':vps.quizAnswers[wordIndex]===optIndex?'rgba(239,68,68,.1)':'var(--white)'):vps.quizAnswers[wordIndex]===optIndex?'var(--brand-orange-light)':'var(--white)'};border:2px solid ${vps.quizSubmitted?(opt===word.definition?'var(--green)':vps.quizAnswers[wordIndex]===optIndex?'var(--red)':'var(--gray-200)'):vps.quizAnswers[wordIndex]===optIndex?'var(--brand-orange)':'var(--gray-200)'};border-radius:8px;font-size:14px;color:var(--brand-charcoal);cursor:${vps.quizSubmitted?'default':'pointer'};text-align:left">${opt}</button>`).join('')}
            </div>
          </div>`}).join('')}
      </div>
      ${!vps.quizSubmitted?`<button onclick="vocabQuizSubmit()" class="btn btn-primary" style="margin-top:24px;width:100%">Submit Quiz</button>`:`
        <div class="card" style="margin-top:24px;text-align:center;padding:32px">
          <div style="font-size:48px;margin-bottom:16px">${vps.quizAnswers.filter((a,i)=>a===generateVocabQuizOptions(sub.words[i],sub.words).indexOf(sub.words[i].definition)).length===sub.words.length?'🏆':'👍'}</div>
          <h3 style="font-size:20px;font-weight:700;color:var(--brand-charcoal);margin-bottom:8px">Quiz Complete!</h3>
          <p style="font-size:14px;color:var(--gray-600)">You earned XP for completing this vocabulary quiz.</p>
        </div>
      `}
    `;
  }else if(vps.mode==='matching'){
    const shuffledRight=vps.matchingPairs.shuffled||shuffleArray(sub.words.map((_,i)=>i));
    if(!vps.matchingPairs.shuffled)vps.matchingPairs.shuffled=shuffledRight;
    
    content=`
      <h3 class="font-heading" style="font-size:20px;font-weight:700;color:var(--brand-charcoal);margin-bottom:24px">Match words with their definitions</h3>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px">
        <div>
          <h4 style="font-size:14px;font-weight:600;color:var(--gray-500);margin-bottom:12px">Words</h4>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${sub.words.map((word,index)=>`<button onclick="vocabMatchClick('left',${index})" ${vps.matchingPairs.matched.has(index)?'disabled':''} style="padding:12px 16px;background:${vps.matchingPairs.matched.has(index)?'rgba(16,185,129,.1)':vps.matchingPairs.left===index?'var(--brand-orange-light)':'var(--white)'};border:2px solid ${vps.matchingPairs.matched.has(index)?'var(--green)':vps.matchingPairs.left===index?'var(--brand-orange)':'var(--gray-200)'};border-radius:8px;font-size:14px;font-weight:600;color:${vps.matchingPairs.matched.has(index)?'var(--green)':'var(--brand-charcoal)'};cursor:${vps.matchingPairs.matched.has(index)?'default':'pointer'};text-align:left">${word.word}${vps.matchingPairs.matched.has(index)?' ✓':''}</button>`).join('')}
          </div>
        </div>
        <div>
          <h4 style="font-size:14px;font-weight:600;color:var(--gray-500);margin-bottom:12px">Definitions</h4>
          <div style="display:flex;flex-direction:column;gap:8px">
            ${shuffledRight.map((wordIndex,shuffledIndex)=>{const word=sub.words[wordIndex];return`<button onclick="vocabMatchClick('right',${shuffledIndex})" ${vps.matchingPairs.matched.has(wordIndex)?'disabled':''} style="padding:12px 16px;background:${vps.matchingPairs.matched.has(wordIndex)?'rgba(16,185,129,.1)':vps.matchingPairs.right===shuffledIndex?'var(--brand-orange-light)':'var(--white)'};border:2px solid ${vps.matchingPairs.matched.has(wordIndex)?'var(--green)':vps.matchingPairs.right===shuffledIndex?'var(--brand-orange)':'var(--gray-200)'};border-radius:8px;font-size:13px;color:${vps.matchingPairs.matched.has(wordIndex)?'var(--green)':'var(--brand-charcoal)'};cursor:${vps.matchingPairs.matched.has(wordIndex)?'default':'pointer'};text-align:left">${word.definition}${vps.matchingPairs.matched.has(wordIndex)?' ✓':''}</button>`}).join('')}
          </div>
        </div>
      </div>
      ${vps.matchingPairs.matched.size===sub.words.length?`
        <div class="card" style="margin-top:24px;text-align:center;padding:32px">
          <div style="font-size:48px;margin-bottom:16px">🎉</div>
          <h3 style="font-size:20px;font-weight:700;color:var(--brand-charcoal);margin-bottom:8px">All Matched!</h3>
          <p style="font-size:14px;color:var(--gray-600)">You earned 30 XP for completing the matching game.</p>
        </div>
      `:''}
    `;
  }
  
  return`<div style="min-height:100vh">
    ${bannerHTML('',true)}
    <div style="background:var(--brand-charcoal);padding:16px 24px;display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;align-items:center;gap:16px">
        <button onclick="goBackToCategory()" class="btn btn-secondary btn-sm" style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:white">← Back</button>
        <div>
          <h1 class="font-heading" style="font-size:20px;font-weight:700;color:white;margin:0">${sub.icon} ${sub.title}</h1>
          <p style="font-size:12px;color:rgba(255,255,255,.6);margin:2px 0 0">${sub.wordCount} words · ${sub.level}</p>
        </div>
      </div>
    </div>
    <div style="background:var(--white);border-bottom:1px solid var(--gray-200);padding:12px 24px;display:flex;gap:8px">
      <button onclick="setVocabMode('learn')" style="padding:8px 16px;background:${vps.mode==='learn'?'var(--brand-orange)':'var(--gray-100)'};color:${vps.mode==='learn'?'white':'var(--brand-charcoal)'};border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">📖 Learn</button>
      <button onclick="setVocabMode('quiz')" style="padding:8px 16px;background:${vps.mode==='quiz'?'var(--brand-orange)':'var(--gray-100)'};color:${vps.mode==='quiz'?'white':'var(--brand-charcoal)'};border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">❓ Quiz</button>

    </div>

  </div>`;

function generateVocabQuizOptions(word,allWords){
  const correct=word.definition;
  const others=allWords.filter(w=>w.word!==word.word).sort(()=>Math.random()-.5).slice(0,3).map(w=>w.definition);
  return[correct,...others].sort(()=>Math.random()-.5);
}

function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}

function setVocabMode(mode){vocabPracticeState.mode=mode;render()}
function vocabPrev(){if(vocabPracticeState.wordIndex>0){vocabPracticeState.wordIndex--;vocabPracticeState.showDefinition=false;render()}}
function vocabNext(){const sub=state.activeVocabSubcategory;if(vocabPracticeState.wordIndex<sub.words.length-1){vocabPracticeState.wordIndex++;vocabPracticeState.showDefinition=false;render()}}
function vocabQuizAnswer(wordIndex,optIndex){vocabPracticeState.quizAnswers[wordIndex]=optIndex;render()}
function vocabQuizSubmit(){
  vocabPracticeState.quizSubmitted=true;
  const sub=state.activeVocabSubcategory;
  const correct=vocabPracticeState.quizAnswers.filter((a,i)=>a===generateVocabQuizOptions(sub.words[i],sub.words).indexOf(sub.words[i].definition)).length;
  const xpReward=Math.round((correct/sub.words.length)*50);
  completeItem('vocabulary',sub.id,xpReward);
  state.score+=xpReward;
  const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);
  if(s){s.xp+=xpReward;s.activitiesCompleted=(s.activitiesCompleted||0)+1;saveStudents(students)}
  render();
}
function vocabMatchClick(side,index){
  const sub=state.activeVocabSubcategory;
  const mp=vocabPracticeState.matchingPairs;
  const shuffledRight=mp.shuffled;
  
  if(side==='left'){
    if(mp.matched.has(index))return;
    mp.left=index;
    if(mp.right!==null){
      const rightWordIndex=shuffledRight[mp.right];
      if(index===rightWordIndex){
        mp.matched.add(index);
        mp.left=null;mp.right=null;
        if(mp.matched.size===sub.words.length){
          completeItem('vocabulary',sub.id,30);
          state.score+=30;
          const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);
          if(s){s.xp+=30;s.activitiesCompleted=(s.activitiesCompleted||0)+1;saveStudents(students)}
        }
      }else{setTimeout(()=>{mp.left=null;mp.right=null;render()},800)}
    }
  }else{
    const wordIndex=shuffledRight[index];
    if(mp.matched.has(wordIndex))return;
    mp.right=index;
    if(mp.left!==null){
      if(mp.left===wordIndex){
        mp.matched.add(wordIndex);
        mp.left=null;mp.right=null;
        if(mp.matched.size===sub.words.length){
          completeItem('vocabulary',sub.id,30);
          state.score+=30;
          const students=loadStudents();const s=students.find(x=>x.code===state.studentCode);
          if(s){s.xp+=30;s.activitiesCompleted=(s.activitiesCompleted||0)+1;saveStudents(students)}
        }
      }else{setTimeout(()=>{mp.left=null;mp.right=null;render()},800)}
    }
  }
  render();
}

function openModal(type){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.id='activeModal';
  overlay.onclick=e=>{if(e.target===overlay)closeModal()};
  
  if(type==='leaderboard')overlay.innerHTML=renderLeaderboardModal();
  else if(type==='achievements')overlay.innerHTML=renderAchievementsModal();
  else if(type==='profile')overlay.innerHTML=renderProfileModal();
  else if(type==='dictionary')overlay.innerHTML=renderDictionaryModal();
  
  document.body.appendChild(overlay);
  if(type==='achievements')attachAchievementEvents();
  if(type==='profile')attachProfileEvents();
  if(type==='dictionary')attachDictionaryEvents();
}

// ==================== EVENT HANDLERS ====================
function attachEvents(){
  // Login
  const lf=document.getElementById('loginForm');
  if(lf){
    const ni=document.getElementById('nameInput'),ci=document.getElementById('codeInput'),lb=document.getElementById('loginBtn');
    const update=()=>{lb.disabled=!(ni.value.trim()&&ci.value.trim())};
    ni.addEventListener('input',update);ci.addEventListener('input',update);
    lf.addEventListener('submit',e=>{
      e.preventDefault();
      const name=ni.value.trim(),code=ci.value.trim();
      const err=document.getElementById('loginError');
      if(!name){err.textContent='Please enter your name.';err.style.display='block';return}
      if(name.toLowerCase()===ADMIN_NAME&&code===ADMIN_CODE){
        state.studentName='Teacher Steve';state.studentCode=ADMIN_CODE;state.isAdmin=true;state.view='home';trackLoginStreak();render();return;
      }
      const students=loadStudents();const student=students.find(s=>s.code===code);
      if(!student){err.textContent='Invalid code. Please check with your teacher.';err.style.display='block';return}
      err.style.display='none';
      state.studentName=student.name;state.studentCode=student.code;state.isAdmin=false;state.score=student.xp;state.view='home';
      const streak=trackLoginStreak();render();
    });
  }

  // Quiz options
  document.querySelectorAll('.quiz-option').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const qi=parseInt(btn.dataset.qi),oi=parseInt(btn.dataset.oi);
      const qs=window._quiz;if(qs.answers[qi]!==null)return;
      qs.answers[qi]=oi;
      const lesson=state.activeLesson;const s=lesson.sections[lessonState.section];
      const q=s.quiz.questions[qi];const ok=oi===q.answer;
      document.querySelectorAll('.quiz-option').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');else if(j===oi&&!ok)b.classList.add('wrong')});
      const fb=document.getElementById('quizFeedback');
      fb.innerHTML=`<div style="padding:16px;border-radius:10px;${ok?'background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2)':'background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15)'}"><div style="font-size:14px;font-weight:500;margin-bottom:4px;${ok?'color:var(--green)':'color:var(--red)'}">${ok?'✓ Correct!':'✗ Not quite'}</div><div style="font-size:14px;color:var(--gray-600)">${q.explanation}</div></div>`;
      fb.style.display='block';
      document.getElementById('quizNextArea').style.display='block';
    });
  });

  // Test options
  document.querySelectorAll('.test-option').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const ti=parseInt(btn.dataset.ti);
      testState.answers[testState.q]=ti;
      render();
    });
  });

  // Flashcard
  const fc=document.getElementById('flashcard');
  if(fc)fc.addEventListener('click',()=>{window._fc.flipped=!window._fc.flipped;document.getElementById('fcArea').innerHTML=renderFC(state.activeLesson.sections[lessonState.section].flashcards);attachEvents()});

  // Matching
  document.querySelectorAll('[data-left]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.dataset.left);const ms=window._match;const m=state.activeLesson.sections[lessonState.section].matching;
      if(ms.matched.has(i))return;ms.sl=i;ms.att++;
      if(ms.sr!==null){const ri=m.pairs.indexOf(ms.shuffled[ms.sr]);if(i===ri){ms.matched.add(i);ms.sl=null;ms.sr=null}else setTimeout(()=>{ms.sl=null;ms.sr=null;document.getElementById('matchArea').innerHTML=renderMatch(m);attachEvents()},800)}
      document.getElementById('matchArea').innerHTML=renderMatch(m);attachEvents();
    });
  });
  document.querySelectorAll('[data-right]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.dataset.right);const ms=window._match;const m=state.activeLesson.sections[lessonState.section].matching;
      const pi=m.pairs.indexOf(ms.shuffled[i]);if(ms.matched.has(pi))return;ms.sr=i;ms.att++;
      if(ms.sl!==null){if(ms.sl===pi){ms.matched.add(pi);ms.sl=null;ms.sr=null}else setTimeout(()=>{ms.sl=null;ms.sr=null;document.getElementById('matchArea').innerHTML=renderMatch(m);attachEvents()},800)}
      document.getElementById('matchArea').innerHTML=renderMatch(m);attachEvents();
    });
  });
}
