<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Steve's - Interactive Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --sky-1: #e0f2fe; --sky-2: #bae6fd; --sky-3: #7dd3fc; --sky-4: #38bdf8;
  --orange-deep: #E65100; --orange-primary: #FF9800; --amber: #FFC107; --white: #FFFFFF;
  --text-primary: #1E293B; --text-secondary: #64748B; --text-tertiary: #94A3B8;
  --green: #10b981; --red: #ef4444; --blue-light: #3b82f6; --purple-light: #a78bfa;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif; color: var(--text-primary); min-height: 100vh; margin: 0; padding: 0;
  overflow-x: hidden;
  background: linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 40%, var(--sky-3) 70%, var(--sky-4) 100%);
  background-attachment: fixed;
}
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 600px 300px at 15% 20%, rgba(255,255,255,0.7) 0%, transparent 70%),
    radial-gradient(ellipse 500px 250px at 75% 15%, rgba(255,255,255,0.5) 0%, transparent 70%),
    radial-gradient(ellipse 700px 350px at 50% 60%, rgba(255,255,255,0.4) 0%, transparent 70%),
    radial-gradient(ellipse 400px 200px at 85% 75%, rgba(255,255,255,0.6) 0%, transparent 70%),
    radial-gradient(ellipse 500px 250px at 20% 80%, rgba(255,255,255,0.5) 0%, transparent 70%);
}
#app { position: relative; z-index: 1; }
.font-space { font-family: 'Space Grotesk', sans-serif; }
.font-mono { font-family: 'JetBrains Mono', monospace; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes float { 0%, 100% { transform: translate(0,0); } 50% { transform: translate(30px,-30px); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.animate-fade-in { animation: fadeIn 0.4s ease-out; }
.animate-slide-up { animation: slideUp 0.5s ease-out; }

/* Header Banner - Centered title with refined geometric design */
.header-banner { position: relative; width: 100%; height: 72px; overflow: hidden; background: linear-gradient(90deg, #E65100 0%, #FF9800 30%, #FFC107 55%, #FFFFFF 100%); }
.header-banner::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(230,81,0,0.85), rgba(230,81,0,0.6)); clip-path: polygon(0 0, 48% 0, 32% 100%, 0 100%); z-index: 1; }
.header-banner::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,152,0,0.8), rgba(255,152,0,0.55)); clip-path: polygon(12% 0, 58% 0, 42% 100%, 0% 100%); z-index: 2; }
.hg1 { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,193,7,0.75), rgba(255,193,7,0.5)); clip-path: polygon(25% 0, 68% 0, 52% 100%, 10% 100%); z-index: 3; }
.hg2 { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,193,7,0.6), rgba(255,255,255,0.4)); clip-path: polygon(40% 0, 78% 0, 62% 100%, 25% 100%); z-index: 4; }
.hg3 { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.7)); clip-path: polygon(55% 0, 88% 0, 72% 100%, 40% 100%); z-index: 5; }
.hg4 { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(255,255,255,0.85)); clip-path: polygon(68% 0, 95% 0, 82% 100%, 55% 100%); z-index: 6; }
.hg5 { position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,0.75), rgba(255,255,255,0.95)); clip-path: polygon(80% 0, 100% 0, 100% 100%, 68% 100%); z-index: 7; }
.banner-line { position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, #E65100, #FF9800, #FFC107, transparent 70%); z-index: 10; }
.banner-content { position: relative; z-index: 20; height: 100%; max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: center; }

/* Cards - Frosted glass transparency */
.card { background: rgba(255,255,255,0.75); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06), 0 1px 4px rgba(0,0,0,0.04); transition: all 0.3s ease; }
.card:hover { background: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.7); box-shadow: 0 8px 30px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04); }
.card-interactive { cursor: pointer; }
.card-interactive:hover { transform: translateY(-4px); box-shadow: 0 12px 40px rgba(0,0,0,0.1), 0 4px 12px rgba(0,0,0,0.06); }

/* Tags */
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; }
.tag-blue { background: rgba(59,130,246,0.1); color: var(--blue-light); border: 1px solid rgba(59,130,246,0.2); }
.tag-green { background: rgba(16,185,129,0.1); color: var(--green); border: 1px solid rgba(16,185,129,0.25); }
.tag-amber { background: rgba(255,152,0,0.1); color: var(--orange-primary); border: 1px solid rgba(255,152,0,0.25); }
.tag-purple { background: rgba(139,92,246,0.1); color: var(--purple-light); border: 1px solid rgba(139,92,246,0.2); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s ease; font-size: 14px; padding: 12px 24px; }
.btn-primary { background: var(--orange-primary); color: white; box-shadow: 0 4px 15px rgba(255,152,0,0.3); }
.btn-primary:hover { background: #F57C00; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,152,0,0.4); }
.btn-secondary { background: rgba(255,255,255,0.7); backdrop-filter: blur(8px); border: 1px solid rgba(30,41,59,0.15); color: var(--text-primary); }
.btn-secondary:hover { background: rgba(255,255,255,0.85); }

/* Login */
.login-card { background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.6); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); padding: 48px 40px; }
.login-input { width: 100%; background: rgba(255,255,255,0.9); border: 1px solid rgba(148,163,184,0.2); border-radius: 12px; padding: 14px 18px; color: var(--text-primary); font-size: 16px; outline: none; transition: all 0.2s; }
.login-input:focus { border-color: var(--orange-primary); box-shadow: 0 0 0 3px rgba(255,152,0,0.1); }
.login-input-mono { font-family: 'JetBrains Mono', monospace; letter-spacing: 0.05em; }
.login-btn { width: 100%; background: var(--text-primary); color: white; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 16px; padding: 14px 24px; border: none; border-radius: 12px; cursor: pointer; transition: all 0.2s; margin-top: 24px; }
.login-btn:hover:not(:disabled) { background: #0f172a; transform: translateY(-1px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
.login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

/* Progress */
.progress-track { height: 4px; background: rgba(255,255,255,0.4); }
.progress-fill { height: 100%; background: linear-gradient(90deg, #E65100, #FF9800, #FFC107); transition: width 0.5s ease; }

/* Tables */
.lesson-table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 16px 0; font-size: 14px; overflow: hidden; border-radius: 12px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.75); }
.lesson-table th { text-align: left; padding: 12px 16px; font-family: 'Space Grotesk', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); background: rgba(255,255,255,0.6); border-bottom: 1px solid rgba(255,255,255,0.5); }
.lesson-table td { padding: 12px 16px; border-bottom: 1px solid rgba(0,0,0,0.04); line-height: 1.5; color: var(--text-primary); }
.lesson-table tr:last-child td { border-bottom: none; }

/* Callouts */
.callout { border-radius: 12px; padding: 16px 20px; margin: 16px 0; font-size: 14px; line-height: 1.7; }
.callout-blue { background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.2); }
.callout-blue strong { color: var(--blue-light); }
.callout-amber { background: rgba(255,152,0,0.08); border: 1px solid rgba(255,152,0,0.2); }
.callout-amber strong { color: var(--orange-primary); }
.callout-green { background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.2); }
.callout-green strong { color: var(--green); }
.callout-purple { background: rgba(139,92,246,0.08); border: 1px solid rgba(139,92,246,0.2); }
.callout-purple strong { color: var(--purple-light); }

/* Game options */
.game-option { background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.5); border-radius: 12px; padding: 14px 20px; font-size: 15px; color: var(--text-primary); cursor: pointer; transition: all 0.15s ease; text-align: left; width: 100%; font-family: 'Inter', sans-serif; }
.game-option:hover:not(:disabled) { background: rgba(255,152,0,0.08); border-color: rgba(255,152,0,0.4); transform: translateX(4px); }
.game-option:disabled { cursor: default; opacity: 0.7; }
.game-option.correct { background: rgba(16,185,129,0.1); border-color: var(--green); color: var(--green); }
.game-option.wrong { background: rgba(239,68,68,0.08); border-color: var(--red); color: var(--red); }

/* Flashcards */
.flashcard-container { perspective: 1000px; width: 100%; max-width: 400px; height: 240px; margin: 0 auto; cursor: pointer; }
.flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s cubic-bezier(0.4,0,0.2,1); transform-style: preserve-3d; }
.flashcard-inner.flipped { transform: rotateY(180deg); }
.flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.flashcard-front { background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
.flashcard-back { background: linear-gradient(135deg, rgba(255,152,0,0.08), rgba(255,193,7,0.08)); border: 1px solid rgba(255,152,0,0.2); box-shadow: 0 4px 20px rgba(0,0,0,0.06); transform: rotateY(180deg); }

/* Matching */
.match-item { padding: 12px 18px; background: rgba(255,255,255,0.6); border: 1px solid rgba(255,255,255,0.5); border-radius: 12px; font-size: 14px; cursor: pointer; transition: all 0.15s ease; text-align: center; color: var(--text-primary); }
.match-item:hover { border-color: rgba(255,152,0,0.3); background: rgba(255,255,255,0.8); }
.match-item.selected { border-color: var(--orange-primary); background: rgba(255,152,0,0.08); color: var(--orange-deep); }
.match-item.matched { border-color: var(--green); background: rgba(16,185,129,0.1); color: var(--green); cursor: default; }

/* Word chips */
.word-chip { display: inline-flex; align-items: center; padding: 8px 16px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.5); border-radius: 10px; font-size: 14px; font-weight: 500; cursor: grab; transition: all 0.15s ease; user-select: none; color: var(--text-primary); }
.word-chip:hover { background: rgba(255,152,0,0.08); border-color: var(--orange-primary); color: var(--orange-deep); }
.word-chip.placed { opacity: 0.4; cursor: default; }
.word-chip.selected { background: rgba(255,152,0,0.1); border-color: var(--orange-primary); color: var(--orange-deep); }

/* Streak */
.streak-fire { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; background: linear-gradient(135deg, rgba(255,152,0,0.15), rgba(255,193,7,0.15)); border: 1px solid rgba(255,152,0,0.25); border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--orange-deep); }

@media (max-width: 640px) { .card { padding: 18px; } .flashcard-container { height: 200px; } .header-banner { height: 60px; } }
</style>
</head>
<body>
<div id="app"></div>
<script>
const ADMIN_NAME = 'steve';
const ADMIN_CODE = '2324';
const STORAGE_KEY = 'teacher_steve_students';

// Student management functions
function loadStudents() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    return stored ? JSON.parse(stored) : [];
  } catch {
    return [];
  }
}

function saveStudents(students) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
}

function generateUniqueCode(existingStudents) {
  const existingCodes = new Set(existingStudents.map(s => s.code));
  let code;
  do {
    code = Math.floor(1000 + Math.random() * 9000).toString();
  } while (existingCodes.has(code));
  return code;
}

function createStudent(firstName, surname, code, students) {
  const newStudent = {
    firstName,
    surname,
    name: `${firstName} ${surname}`,
    code,
    xp: 0,
    level: 1,
    activitiesCompleted: 0,
    lessonsCompleted: 0,
    storiesRead: 0,
    gamesPlayed: 0,
  };
  const updated = [...students, newStudent];
  saveStudents(updated);
  return newStudent;
}

function updateStudent(code, updates, students) {
  const updated = students.map(s => s.code === code ? { ...s, ...updates } : s);
  saveStudents(updated);
  return updated;
}

function deleteStudent(code, students) {
  const updated = students.filter(s => s.code !== code);
  saveStudents(updated);
  return updated;
}

function getTopStudents(students, count = 3) {
  return [...students].sort((a, b) => b.xp - a.xp).slice(0, count);
}

function getFullLeaderboard(students) {
  return [...students].sort((a, b) => b.xp - a.xp);
}

function getLevelInfo(xp) {
  const thresholds = [
    { level: 1, minXP: 0, maxXP: 100 },
    { level: 2, minXP: 101, maxXP: 250 },
    { level: 3, minXP: 251, maxXP: 500 },
    { level: 4, minXP: 501, maxXP: 800 },
    { level: 5, minXP: 801, maxXP: 1200 },
    { level: 6, minXP: 1201, maxXP: 1700 },
    { level: 7, minXP: 1701, maxXP: 2300 },
    { level: 8, minXP: 2301, maxXP: 3000 },
    { level: 9, minXP: 3001, maxXP: 3800 },
    { level: 10, minXP: 3801, maxXP: 5000 },
  ];
  
  let level = 1;
  for (let i = thresholds.length - 1; i >= 0; i--) {
    if (xp >= thresholds[i].minXP) {
      level = thresholds[i].level;
      const currentXP = xp - thresholds[i].minXP;
      const maxXP = thresholds[i].maxXP - thresholds[i].minXP;
      const progress = Math.min((currentXP / maxXP) * 100, 100);
      return { level, currentXP, maxXP, progress };
    }
  }
  return { level: 1, currentXP: xp, maxXP: 100, progress: 0 };
}

function getLevelColor(level) {
  if (level >= 8) return '#FFD700';
  if (level >= 5) return '#C0C0C0';
  if (level >= 3) return '#CD7F32';
  return '#64748B';
}

function renderStudentManagement() {
  const students = loadStudents();
  
  return `
    <div style="padding:0 24px 48px">
      <div style="max-width:1200px;margin:0 auto">
        <div class="card" style="background:rgba(255,255,255,0.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,152,0,0.2)">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
            <h3 class="font-space" style="font-size:24px;font-weight:700;color:#1E293B;margin:0">👑 Student Management</h3>
            <button id="showCreateStudentBtn" class="btn btn-primary" style="background:linear-gradient(135deg,#FF9800,#F57C00)">+ Create Student</button>
          </div>
          
          <div id="studentFormContainer" style="display:none;margin-bottom:20px"></div>
          
          ${students.length === 0 ? `
            <div style="text-align:center;padding:40px 20px;color:#64748B">
              <div style="font-size:48px;margin-bottom:12px">📚</div>
              <p style="font-size:16px;margin:0">No students yet. Click "Create Student" to add your first student!</p>
            </div>
          ` : `
            <div style="overflow-x:auto">
              <table style="width:100%;border-collapse:collapse">
                <thead>
                  <tr style="border-bottom:2px solid rgba(148,163,184,0.2)">
                    <th style="text-align:left;padding:12px;font-size:13px;font-weight:600;color:#64748B">Name</th>
                    <th style="text-align:left;padding:12px;font-size:13px;font-weight:600;color:#64748B">Code</th>
                    <th style="text-align:left;padding:12px;font-size:13px;font-weight:600;color:#64748B">Level</th>
                    <th style="text-align:left;padding:12px;font-size:13px;font-weight:600;color:#64748B">XP</th>
                    <th style="text-align:left;padding:12px;font-size:13px;font-weight:600;color:#64748B">Activities</th>
                    <th style="text-align:right;padding:12px;font-size:13px;font-weight:600;color:#64748B">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${students.map(s => {
                    const levelInfo = getLevelInfo(s.xp);
                    const levelColor = getLevelColor(levelInfo.level);
                    return `
                      <tr style="border-bottom:1px solid rgba(148,163,184,0.1)">
                        <td style="padding:12px;font-size:14px">
                          <div style="font-weight:600">${s.name}</div>
                          <div style="font-size:12px;color:#64748B">${s.firstName} ${s.surname}</div>
                        </td>
                        <td style="padding:12px;font-size:14px;font-family:monospace">${s.code}</td>
                        <td style="padding:12px">
                          <span style="display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600;background:${levelColor}20;color:${levelColor}">Level ${levelInfo.level}</span>
                        </td>
                        <td style="padding:12px;font-size:14px">${s.xp} XP</td>
                        <td style="padding:12px;font-size:14px">${s.activitiesCompleted}</td>
                        <td style="padding:12px;text-align:right">
                          <button class="edit-student-btn" data-code="${s.code}" style="background:rgba(59,130,246,0.1);color:#3B82F6;border:none;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;margin-right:8px">Edit</button>
                          <button class="delete-student-btn" data-code="${s.code}" style="background:rgba(239,68,68,0.1);color:#DC2626;border:none;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer">Delete</button>
                        </td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          `}
        </div>
      </div>
    </div>
  `;
}

function renderStudentForm(editingStudent = null) {
  const isEdit = editingStudent !== null;
  
  return `
    <div style="background:rgba(255,255,255,0.9);border-radius:12px;padding:20px;margin-bottom:20px;border:1px solid rgba(255,255,255,0.5)">
      <h4 style="margin:0 0 16px 0;font-size:18px">${isEdit ? 'Edit Student' : 'Create New Student'}</h4>
      
      <div style="display:grid;gap:16px;margin-bottom:16px">
        <div>
          <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500">First Name</label>
          <input type="text" id="studentFirstName" value="${isEdit ? editingStudent.firstName : ''}" placeholder="Enter first name" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(148,163,184,0.3);font-size:14px;outline:none" />
        </div>
        
        <div>
          <label style="display:block;margin-bottom:6px;font-size:14px;font-weight:500">Surname</label>
          <input type="text" id="studentSurname" value="${isEdit ? editingStudent.surname : ''}" placeholder="Enter surname" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(148,163,184,0.3);font-size:14px;outline:none" />
        </div>
        
        ${!isEdit ? `
          <div>
            <label style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px;font-weight:500">
              <input type="checkbox" id="autoGenerateCode" checked />
              Auto-generate 4-digit code
            </label>
            <input type="text" id="studentCode" placeholder="Enter 4-digit code" maxlength="4" style="width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(148,163,184,0.3);font-size:14px;font-family:monospace;outline:none;display:none" />
          </div>
        ` : ''}
      </div>
      
      <div id="studentFormError" style="display:none;background:rgba(239,68,68,0.1);color:#DC2626;padding:10px 14px;border-radius:8px;margin-bottom:16px;font-size:14px"></div>
      
      <div style="display:flex;gap:12px">
        <button id="saveStudentBtn" class="btn" style="background:linear-gradient(135deg,#10B981,#059669);color:white" data-editing="${isEdit ? editingStudent.code : 'false'}">
          ${isEdit ? 'Update Student' : 'Create Student'}
        </button>
        <button id="cancelStudentBtn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  `;
}

function attachStudentManagementEvents() {
  const showCreateBtn = document.getElementById('showCreateStudentBtn');
  if (showCreateBtn) {
    showCreateBtn.addEventListener('click', () => {
      const container = document.getElementById('studentFormContainer');
      container.innerHTML = renderStudentForm();
      container.style.display = 'block';
      attachStudentFormEvents();
    });
  }
  
  document.querySelectorAll('.edit-student-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.dataset.code;
      const students = loadStudents();
      const student = students.find(s => s.code === code);
      if (student) {
        const container = document.getElementById('studentFormContainer');
        container.innerHTML = renderStudentForm(student);
        container.style.display = 'block';
        attachStudentFormEvents();
      }
    });
  });
  
  document.querySelectorAll('.delete-student-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const code = btn.dataset.code;
      if (confirm('Are you sure you want to delete this student? This action cannot be undone.')) {

function attachStudentFormEvents() {
  const autoGenCheckbox = document.getElementById('autoGenerateCode');
  const codeInput = document.getElementById('studentCode');
  
  if (autoGenCheckbox && codeInput) {
    autoGenCheckbox.addEventListener('change', () => {
      codeInput.style.display = autoGenCheckbox.checked ? 'none' : 'block';
    });
  }
  
  const saveBtn = document.getElementById('saveStudentBtn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      const firstName = document.getElementById('studentFirstName').value.trim();
      const surname = document.getElementById('studentSurname').value.trim();
      const errorDiv = document.getElementById('studentFormError');
      
      if (!firstName || !surname) {
        errorDiv.textContent = 'Please enter both first name and surname.';
        errorDiv.style.display = 'block';
        return;
      }
      
      const editingCode = saveBtn.dataset.editing;
      const students = loadStudents();
      
      if (editingCode === 'false') {
        const autoGen = document.getElementById('autoGenerateCode').checked;
        const code = autoGen ? generateUniqueCode(students) : document.getElementById('studentCode').value.trim();
        
        if (!code) {
          errorDiv.textContent = 'Please enter a student code or enable auto-generation.';
          errorDiv.style.display = 'block';
          return;
        }
        
        if (students.some(s => s.code === code)) {
          errorDiv.textContent = 'A student with this code already exists.';
          errorDiv.style.display = 'block';
          return;
        }
        
        createStudent(firstName, surname, code, students);
      } else {
        updateStudent(editingCode, {
          firstName,
          surname,
          name: `${firstName} ${surname}`
        }, students);
      }
      
      render();
    });
  }
  
  const cancelBtn = document.getElementById('cancelStudentBtn');
  if (cancelBtn) {
    cancelBtn.addEventListener('click', () => {
      const container = document.getElementById('studentFormContainer');
      container.innerHTML = '';
      container.style.display = 'none';
    });
  }
}

function attachLoginEvents() {
  const nameInput = document.getElementById('nameInput');
  const codeInput = document.getElementById('codeInput');
  const loginBtn = document.getElementById('loginBtn');

  const updateBtnState = () => {
    loginBtn.disabled = !(nameInput.value.trim() && codeInput.value.trim());
  };
  nameInput.addEventListener('input', updateBtnState);
  codeInput.addEventListener('input', updateBtnState);

  nameInput.addEventListener('focus', () => { nameInput.style.borderColor='#FF9800'; nameInput.style.boxShadow='0 0 0 3px rgba(255,152,0,0.1)'; });
  nameInput.addEventListener('blur', () => { nameInput.style.borderColor='rgba(148,163,184,0.2)'; nameInput.style.boxShadow='none'; });
  codeInput.addEventListener('focus', () => { codeInput.style.borderColor='#FF9800'; codeInput.style.boxShadow='0 0 0 3px rgba(255,152,0,0.1)'; });
  codeInput.addEventListener('blur', () => { codeInput.style.borderColor='rgba(148,163,184,0.2)'; codeInput.style.boxShadow='none'; });

  document.getElementById('loginForm').addEventListener('submit', e => {
    e.preventDefault();
    const trimmedName = nameInput.value.trim();
    const trimmedCode = codeInput.value.trim();
    const err = document.getElementById('loginError');

    if (!trimmedName) { err.textContent='Please enter your name.'; err.style.display='block'; return; }

    // Admin logic: name="Steve" + code="2324"
    if (trimmedName.toLowerCase() === ADMIN_NAME && trimmedCode === ADMIN_CODE) {
      err.style.display = 'none';
      state.studentName = 'Teacher Steve';
      state.studentCode = ADMIN_CODE;
      state.isAdmin = true;
      state.view = 'home';
      render();
      return;
    }

    // Check if code exists in student list
    const students = loadStudents();
    const student = students.find(s => s.code === trimmedCode);

    if (!student) {
      err.textContent='Invalid code. Please check with your teacher.';
      err.style.display='block';
      return;
    }

    err.style.display = 'none';
    state.studentName = student.name;
    state.studentCode = student.code;
    state.isAdmin = false;
    state.view = 'home';
    render();
  });
}

  document.getElementById('clearWord').addEventListener('click',()=>{ document.getElementById('wordInput').value=''; document.getElementById('wordFeedback').style.display='none'; });
  const wi=document.getElementById('wordInput');
  wi.addEventListener('focus',()=>{ wi.style.borderColor='#FF9800'; wi.style.boxShadow='0 0 0 3px rgba(255,152,0,0.1)'; });
  wi.addEventListener('blur',()=>{ wi.style.borderColor='rgba(148,163,184,0.2)'; wi.style.boxShadow='none'; });
  
  if (state.isAdmin) {
    attachStudentManagementEvents();
  }
}

function showWordFeedback(type,msg) {
  const fb=document.getElementById('wordFeedback');
  fb.innerHTML=`<div style="padding:12px 16px;border-radius:10px;font-size:14px;line-height:1.5;background:${type==='success'?'rgba(16,185,129,0.08)':'rgba(239,68,68,0.06)'};border:1px solid ${type==='success'?'rgba(16,185,129,0.2)':'rgba(239,68,68,0.15)'};color:${type==='success'?'#10b981':'#ef4444'}">${msg}</div>`;
  fb.style.display='block';
}

function updateFact() {
  const fact=FUN_FACTS[state.factIndex];
  document.getElementById('factContent').innerHTML=`<div style="display:flex;align-items:flex-start;gap:16px;margin-bottom:16px"><div style="font-size:40px;line-height:1">${fact.emoji}</div><div style="flex:1"><h4 class="font-space" style="font-size:20px;font-weight:600;color:#1E293B;margin:0 0 12px">${fact.title}</h4><p style="font-size:15px;color:#1E293B;line-height:1.7;margin:0 0 16px">${fact.fact}</p><div style="background:rgba(59,130,246,0.08);border:1px solid rgba(59,130,246,0.2);border-radius:12px;padding:12px 16px"><div style="font-size:12px;font-weight:600;color:#3b82f6;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">💡 Learning Tip</div><p style="font-size:14px;color:#1E293B;line-height:1.6;margin:0">${fact.tip}</p></div></div></div>`;
  document.querySelectorAll('.fact-dot').forEach((d,i)=>{ d.style.width=i===state.factIndex?'24px':'8px'; d.style.borderRadius=i===state.factIndex?'4px':'50%'; d.style.background=i===state.factIndex?'#3b82f6':'rgba(59,130,246,0.2)'; });
}

function startFactCarousel() { if(state.factInterval)clearInterval(state.factInterval); state.factInterval=setInterval(()=>{ state.factIndex=(state.factIndex+1)%FUN_FACTS.length; updateFact(); },8000); }
function resetFactTimer() { if(state.factInterval)clearInterval(state.factInterval); startFactCarousel(); }

function startTimer() { if(state.timerInterval)clearInterval(state.timerInterval); state.timerInterval=setInterval(()=>{ if(state.totalSeconds>0){state.totalSeconds--;const t=document.getElementById('timer');if(t){const m=Math.floor(state.totalSeconds/60);const s=state.totalSeconds%60;t.textContent=`${m}:${s.toString().padStart(2,'0')}`}}else clearInterval(state.timerInterval); },1000); }

function renderLesson() {
  const l=state.activeLesson, s=l.sections[state.currentSection], p=((state.currentSection+1)/l.sections.length)*100;
  return `<div style="min-height:100vh">${bannerHTML(`<div style="display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.75);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.5);border-radius:12px;padding:8px 14px"><span style="font-size:12px;color:#64748B">${state.studentName}</span></div><div class="font-space" style="font-size:14px;font-weight:600;color:#1E293B;background:rgba(255,255,255,0.7);padding:8px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.5)" id="timer">${Math.floor(state.totalSeconds/60)}:${(state.totalSeconds%60).toString().padStart(2,'0')}</div>`, true)}
    <div style="background:rgba(255,255,255,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.5);padding:12px 24px"><div style="max-width:1024px;margin:0 auto;display:flex;align-items:center;gap:12px"><button id="backBtn" style="background:rgba(255,255,255,0.7);border:1px solid rgba(30,41,59,0.1);border-radius:8px;padding:6px 12px;font-size:13px;color:#64748B;cursor:pointer">← Back</button><h1 class="font-space" style="font-size:15px;font-weight:600;color:#1E293B;margin:0">${l.title}</h1></div></div>
    <div class="progress-track"><div class="progress-fill" style="width:${p}%"></div></div>
    <div style="background:rgba(255,255,255,0.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,0.4);padding:8px 24px;overflow-x:auto"><div style="max-width:1024px;margin:0 auto;display:flex;gap:4px">${l.sections.map((sec,i)=>`<button class="section-nav-btn" data-section="${i}" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;font-size:12px;font-weight:500;white-space:nowrap;cursor:pointer;border:none;background:${i===state.currentSection?'rgba(255,152,0,0.12)':'transparent'};color:${i===state.currentSection?'#E65100':state.completedSections.has(i)?'#10b981':'#64748B'}">${state.completedSections.has(i)?'✓':i+1+'.'} ${sec.title}</button>`).join('')}</div></div>
    <div style="max-width:1024px;margin:0 auto;padding:32px 24px"><div class="animate-fade-in"><div style="margin-bottom:24px"><div style="display:flex;align-items:center;gap:8px;margin-bottom:8px"><span class="tag tag-${s.type==='quiz'?'green':s.type==='flashcards'?'purple':s.type==='matching'?'amber':'blue'}">${s.type==='quiz'?'✏️ Quiz':s.type==='flashcards'?'🃏 Flashcards':s.type==='matching'?'🔗 Match':s.type==='discussion'?'💬 Discuss':'📖 Learn'}</span><span style="font-size:12px;color:#94A3B8">· ${s.duration} min</span></div><h2 class="font-space" style="font-size:24px;font-weight:700;color:#1E293B">${s.title}</h2></div><div id="sectionContent">${renderSectionContent(s)}</div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:32px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.4)"><button id="prevBtn" ${state.currentSection===0?'disabled style="opacity:0.3;cursor:not-allowed"':''} class="btn btn-secondary">← Previous</button><span style="font-size:12px;color:#64748B">${state.currentSection+1} of ${l.sections.length}</span>${state.currentSection<l.sections.length-1?`<button id="nextBtn" class="btn btn-primary">Next →</button>`:`<button id="finishBtn" class="btn" style="background:linear-gradient(135deg,#10b981,#059669);color:white">✓ Finish Lesson</button>`}</div></div></div></div>`;
}

function renderSectionContent(s) {
  if(s.type==='content') return renderContent(s.content);
  if(s.type==='quiz') { window.quizState={currentQ:0,answers:new Array(s.quiz.questions.length).fill(null),showResult:false}; return `<div id="quizContainer">${renderQuizQ(s.quiz,0)}</div>`; }
  if(s.type==='flashcards') { window.fs={ci:0,flipped:false,known:new Set()}; return `<div id="fcContainer">${renderFC(s.flashcards)}</div>`; }
  if(s.type==='matching') { const sh=[...s.matching.pairs].sort(()=>Math.random()-0.5); window.ms={sl:null,sr:null,matched:new Set(),att:0,shuffled:sh}; return `<div id="matchContainer">${renderMatch(s.matching)}</div>`; }
  if(s.type==='discussion') return renderDiscussion(s.discussion);
  return '';
}

function renderContent(c) {
  let h=`<p style="color:#64748B;font-size:14px;line-height:1.7;margin:0 0 24px">${c.subtitle}</p>`;
  c.blocks.forEach(b=>{ if(b.type==='table') h+=`<div style="overflow-x:auto;margin:16px 0"><table class="lesson-table"><thead><tr>${b.headers.map(hd=>`<th>${hd}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?`<strong>${c}</strong>`:i===1?`<span class="font-mono" style="font-size:12px;color:#E65100;font-weight:500">${c}</span>`:`<span style="color:#64748B;font-style:italic;font-size:13px">${c}</span>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`; else if(b.type==='callout') h+=`<div class="callout callout-${b.variant}">${b.content}</div>`; });
  h+=`<div style="display:flex;justify-content:flex-end;margin-top:24px"><button id="completeContentBtn" class="btn btn-primary">Continue →</button></div>`; return h;
}

function renderQuizQ(qz,idx) {
  const qs=window.quizState;
  if(qs.showResult) { const c=qs.answers.filter((a,i)=>a===qz.questions[i].answer).length; const p=Math.round(c/qz.questions.length*100); return `<div class="card" style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:16px">${p===100?'🏆':p>=80?'🌟':p>=60?'👍':'💪'}</div><div class="font-space" style="font-size:36px;font-weight:700;color:#E65100;margin-bottom:8px">${c}/${qz.questions.length}</div><div style="color:#64748B;margin-bottom:16px">${p===100?'Perfect!':p>=80?'Excellent!':p>=60?'Good job!':'Keep practicing!'}</div><button id="completeQuizBtn" class="btn btn-primary">Continue →</button></div>`; }
  const q=qz.questions[idx];
  return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:24px"><div style="flex:1;height:6px;background:rgba(255,255,255,0.5);border-radius:999px;overflow:hidden"><div style="height:100%;background:linear-gradient(90deg,#FF9800,#FFC107);border-radius:999px;width:${(idx+1)/qz.questions.length*100}%"></div></div><span class="font-space" style="font-size:12px;color:#64748B">${idx+1}/${qz.questions.length}</span></div><div class="card" style="margin-bottom:24px"><div style="font-size:18px;font-weight:500;line-height:1.6;margin-bottom:24px;color:#1E293B">${q.question}</div><div style="display:flex;flex-direction:column;gap:12px">${q.options.map((o,i)=>`<button class="game-option quiz-option" data-index="${i}"><span style="display:inline-flex;align-items:center;gap:12px"><span style="width:24px;height:24px;border-radius:50%;border:1px solid rgba(30,41,59,0.15);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:rgba(255,255,255,0.5)">${String.fromCharCode(65+i)}</span>${o}</span></button>`).join('')}</div><div id="quizFeedback" style="margin-top:16px;display:none"></div></div><div id="quizNextBtn" style="display:none;text-align:right"><button class="btn btn-primary">${idx<qz.questions.length-1?'Next Question →':'See Results →'}</button></div>`;
}

function renderFC(fcs) {
  const fs=window.fs, c=fcs.cards[fs.ci], done=fs.known.size===fcs.cards.length;
  if(done) return `<div class="card" style="text-align:center;padding:24px;background:rgba(16,185,129,0.05);border-color:rgba(16,185,129,0.2)"><div style="font-size:48px;margin-bottom:8px">🎉</div><div class="font-space" style="font-size:18px;font-weight:700;color:#10b981;margin-bottom:4px">All cards learned!</div><p style="font-size:14px;color:#64748B;margin-bottom:16px">Great job!</p><button id="completeFCBtn" class="btn btn-primary">Continue →</button></div>`;
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px"><div style="display:flex;align-items:center;gap:8px"><span style="font-size:12px;color:#64748B">Card ${fs.ci+1} of ${fcs.cards.length}</span><span class="streak-fire">🔥 ${fs.known.size} learned</span></div><div style="flex:1;max-width:200px;height:6px;background:rgba(255,255,255,0.5);border-radius:999px;overflow:hidden;margin-left:16px"><div style="height:100%;background:#10b981;border-radius:999px;width:${fs.known.size/fcs.cards.length*100}%"></div></div></div><div class="flashcard-container" id="flashcard"><div class="flashcard-inner ${fs.flipped?'flipped':''}"><div class="flashcard-front"><div style="font-size:12px;color:#94A3B8;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.08em">Tap to flip</div><div class="font-space" style="font-size:24px;font-weight:700;color:#1E293B;margin-bottom:8px">${c.front}</div>${c.example?`<div style="font-size:14px;color:#64748B;font-style:italic;margin-top:16px">"${c.example}"</div>`:''}</div><div class="flashcard-back"><div style="font-size:12px;color:#E65100;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.08em">Definition</div><div style="font-size:18px;font-weight:500;color:#1E293B;margin-bottom:12px">${c.back}</div>${c.example?`<div style="font-size:14px;color:#64748B;font-style:italic;margin-top:8px;padding-top:12px;border-top:1px solid rgba(0,0,0,0.06)">Example: "${c.example}"</div>`:''}</div></div></div><div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-top:32px"><button id="prevCardBtn" ${fs.ci===0?'disabled style="opacity:0.3"':''} class="btn btn-secondary">← Prev</button>${fs.flipped?`<button id="markUnknownBtn" class="btn btn-secondary" style="border-color:rgba(239,68,68,0.2);color:#ef4444">Still Learning</button><button id="markKnownBtn" class="btn" style="background:linear-gradient(135deg,#10b981,#059669);color:white">✓ Got It!</button>`:''}<button id="nextCardBtn" ${fs.ci===fcs.cards.length-1?'disabled style="opacity:0.3"':''} class="btn btn-secondary">Next →</button></div><div style="display:flex;justify-content:center;gap:6px;margin-top:24px">${fcs.cards.map((_,i)=>`<div style="width:${i===fs.ci?'24':'8'}px;height:8px;border-radius:${i===fs.ci?'4':'50'}px;background:${i===fs.ci?'#FF9800':fs.known.has(i)?'#10b981':'rgba(30,41,59,0.15)'}"></div>`).join('')}</div>`;
}

function renderMatch(m) {
  const ms=window.ms, done=ms.matched.size===m.pairs.length;
  if(done) return `<div class="card" style="text-align:center;padding:24px;margin-top:32px;background:rgba(16,185,129,0.05);border-color:rgba(16,185,129,0.2)"><div style="font-size:48px;margin-bottom:8px">${ms.att===m.pairs.length?'🎯':'⭐'}</div><div class="font-space" style="font-size:18px;font-weight:700;color:#10b981;margin-bottom:4px">All matched!</div><p style="font-size:14px;color:#64748B;margin-bottom:16px">Completed in ${ms.att} attempt${ms.att>1?'s':''}</p><button id="completeMatchBtn" class="btn btn-primary">Continue →</button></div>`;
  return `<p style="font-size:14px;color:#64748B;margin-bottom:24px">${m.instruction}</p><div style="display:flex;align-items:center;gap:16px;margin-bottom:24px"><div style="font-size:12px;color:#64748B">Matched: <span style="color:#10b981;font-weight:600">${ms.matched.size}/${m.pairs.length}</span></div><div style="font-size:12px;color:#64748B">Attempts: <span style="color:#FF9800;font-weight:600">${ms.att}</span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:32px"><div><div class="font-space" style="font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:10px;text-align:center">Term</div><div style="display:flex;flex-direction:column;gap:10px">${m.pairs.map((p,i)=>{const done=ms.matched.has(i),sel=ms.sl===i;return `<div class="match-item ${done?'matched':sel?'selected':''}" data-left="${i}">${p.left} ${done?'✓':''}</div>`}).join('')}</div></div><div><div class="font-space" style="font-size:11px;color:#64748B;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:10px;text-align:center">Meaning</div><div style="display:flex;flex-direction:column;gap:10px">${ms.shuffled.map((p,i)=>{const oi=m.pairs.indexOf(p),done=ms.matched.has(oi),sel=ms.sr===i;return `<div class="match-item ${done?'matched':sel?'selected':''}" data-right="${i}">${p.right} ${done?'✓':''}</div>`}).join('')}</div></div></div>`;
}

function renderDiscussion(d) {
  return `<div class="callout callout-purple" style="margin-bottom:24px"><strong>💬 Speaking Practice:</strong> These questions are designed for conversation with your teacher.</div><div style="display:flex;flex-direction:column;gap:12px;margin-bottom:24px">${d.questions.map((q,i)=>`<div class="card"><div style="display:flex;align-items:flex-start;gap:12px"><span class="font-space" style="font-size:18px;font-weight:700;color:#FF9800;flex-shrink:0">${i+1}.</span><p style="font-size:15px;line-height:1.6;color:#1E293B;margin:0">${q}</p></div></div>`).join('')}</div>${d.tips?`<div class="callout callout-green" style="margin-bottom:24px"><strong>💡 Tips:</strong><ul style="margin-top:8px;display:flex;flex-direction:column;gap:6px;padding-left:0;list-style:none">${d.tips.map(t=>`<li style="font-size:14px;color:#1E293B;display:flex;align-items:flex-start;gap:8px"><span style="color:#10b981">•</span>${t}</li>`).join('')}</ul></div>`:''}<div style="display:flex;justify-content:flex-end"><button id="completeDiscussBtn" class="btn btn-primary">Continue →</button></div>`;
}

function advanceSection() { state.completedSections.add(state.currentSection); if(state.currentSection<state.activeLesson.sections.length-1){state.currentSection++;render();} }

function attachLessonEvents() {
  document.getElementById('backBtn').addEventListener('click',()=>{ if(state.timerInterval)clearInterval(state.timerInterval); state.view='home'; state.activeLesson=null; render(); });
  document.querySelectorAll('.section-nav-btn').forEach(b=>b.addEventListener('click',()=>{ state.currentSection=parseInt(b.dataset.section); render(); }));
  const pb=document.getElementById('prevBtn'); if(pb&&state.currentSection>0) pb.addEventListener('click',()=>{state.currentSection--;render();});
  const nb=document.getElementById('nextBtn'); if(nb) nb.addEventListener('click',()=>{state.completedSections.add(state.currentSection);state.currentSection++;render();});
  const fb=document.getElementById('finishBtn'); if(fb) fb.addEventListener('click',()=>{if(state.timerInterval)clearInterval(state.timerInterval);state.view='home';state.activeLesson=null;render();});
  const s=state.activeLesson.sections[state.currentSection];
  if(s.type==='content'){const b=document.getElementById('completeContentBtn');if(b)b.addEventListener('click',advanceSection);}
  else if(s.type==='quiz') attachQuizEvents(s.quiz);
  else if(s.type==='flashcards') attachFCEvents(s.flashcards);
  else if(s.type==='matching') attachMatchEvents(s.matching);
  else if(s.type==='discussion'){const b=document.getElementById('completeDiscussBtn');if(b)b.addEventListener('click',advanceSection);}
}

function attachQuizEvents(qz) {
  const qs=window.quizState;
  if(qs.showResult){const b=document.getElementById('completeQuizBtn');if(b)b.addEventListener('click',advanceSection);return;}
  document.querySelectorAll('.quiz-option').forEach(btn=>btn.addEventListener('click',()=>{
    const i=parseInt(btn.dataset.index); if(qs.answers[qs.currentQ]!==null) return;
    qs.answers[qs.currentQ]=i; const q=qz.questions[qs.currentQ], ok=i===q.answer;
    document.querySelectorAll('.quiz-option').forEach((b,j)=>{ b.disabled=true; if(j===q.answer)b.classList.add('correct'); else if(j===i&&!ok)b.classList.add('wrong'); });
    const fb=document.getElementById('quizFeedback'); fb.innerHTML=`<div style="padding:16px;border-radius:12px;${ok?'background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2)':'background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.15)'}"><div style="font-size:14px;font-weight:500;margin-bottom:4px;${ok?'color:#10b981':'color:#ef4444'}">${ok?'✓ Correct!':'✗ Not quite'}</div><div style="font-size:14px;color:#64748B">${q.explanation}</div></div>`; fb.style.display='block';
    document.getElementById('quizNextBtn').style.display='block';
    document.getElementById('quizNextBtn').querySelector('button').addEventListener('click',()=>{ if(qs.currentQ<qz.questions.length-1){qs.currentQ++;document.getElementById('quizContainer').innerHTML=renderQuizQ(qz,qs.currentQ);attachQuizEvents(qz);} else{qs.showResult=true;document.getElementById('quizContainer').innerHTML=renderQuizQ(qz,qs.currentQ);attachQuizEvents(qz);} });
  }));
}

function attachFCEvents(fcs) {
  const fs=window.fs;
  if(fs.known.size===fcs.cards.length){const b=document.getElementById('completeFCBtn');if(b)b.addEventListener('click',advanceSection);return;}
  const fc=document.getElementById('flashcard'); if(fc) fc.addEventListener('click',()=>{fs.flipped=!fs.flipped;document.getElementById('fcContainer').innerHTML=renderFC(fcs);attachFCEvents(fcs);});
  const pv=document.getElementById('prevCardBtn'); if(pv&&fs.ci>0) pv.addEventListener('click',()=>{fs.flipped=false;fs.ci--;document.getElementById('fcContainer').innerHTML=renderFC(fcs);attachFCEvents(fcs);});
  const nx=document.getElementById('nextCardBtn'); if(nx&&fs.ci<fcs.cards.length-1) nx.addEventListener('click',()=>{fs.flipped=false;fs.ci++;document.getElementById('fcContainer').innerHTML=renderFC(fcs);attachFCEvents(fcs);});
  const mk=document.getElementById('markKnownBtn'); if(mk) mk.addEventListener('click',e=>{e.stopPropagation();fs.known.add(fs.ci);fs.flipped=false;if(fs.ci<fcs.cards.length-1)fs.ci++;document.getElementById('fcContainer').innerHTML=renderFC(fcs);attachFCEvents(fcs);});
  const mu=document.getElementById('markUnknownBtn'); if(mu) mu.addEventListener('click',e=>{e.stopPropagation();fs.flipped=false;if(fs.ci<fcs.cards.length-1)fs.ci++;document.getElementById('fcContainer').innerHTML=renderFC(fcs);attachFCEvents(fcs);});
}

function attachMatchEvents(m) {
  const ms=window.ms;
  if(ms.matched.size===m.pairs.length){const b=document.getElementById('completeMatchBtn');if(b)b.addEventListener('click',advanceSection);return;}
  document.querySelectorAll('[data-left]').forEach(el=>el.addEventListener('click',()=>{ const i=parseInt(el.dataset.left); if(ms.matched.has(i))return; ms.sl=i; ms.att++; if(ms.sr!==null){const ri=m.pairs.indexOf(ms.shuffled[ms.sr]);if(i===ri){ms.matched.add(i);ms.sl=null;ms.sr=null;}else{setTimeout(()=>{ms.sl=null;ms.sr=null;document.getElementById('matchContainer').innerHTML=renderMatch(m);attachMatchEvents(m);},800);}} document.getElementById('matchContainer').innerHTML=renderMatch(m);attachMatchEvents(m); }));
  document.querySelectorAll('[data-right]').forEach(el=>el.addEventListener('click',()=>{ const i=parseInt(el.dataset.right),pi=m.pairs.indexOf(ms.shuffled[i]); if(ms.matched.has(pi))return; ms.sr=i; ms.att++; if(ms.sl!==null){if(ms.sl===pi){ms.matched.add(pi);ms.sl=null;ms.sr=null;}else{setTimeout(()=>{ms.sl=null;ms.sr=null;document.getElementById('matchContainer').innerHTML=renderMatch(m);attachMatchEvents(m);},800);}} document.getElementById('matchContainer').innerHTML=renderMatch(m);attachMatchEvents(m); }));
}

render();
</script>
</body>
</html>
