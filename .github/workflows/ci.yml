# Checks and deploys for Teacher Steve.
#
# - backend and frontend: checks on every PR and every push to main. They never block a merge.
# - preview: deploys each PR from a branch in this repo to a Vercel preview and checks its health reply.
# - production: on a push to main, after both checks pass, deploys without going live,
#   checks the new deployment, then promotes it to the production address.
#
# Security rules for this file:
# - Never add pull_request_target or workflow_run triggers. They would hand secrets to untrusted code.
# - VERCEL_TOKEN reaches the maintainer's whole Vercel account. Anyone with write access to this
#   repo can read it by changing this file, so adding a Write collaborator needs the maintainer's OK.
# - The deploy jobs run no repo code: no npm ci, no uv sync, no repo scripts, no caches, no
#   third-party actions. Secrets go only into the env of the steps that need them, and no step
#   in those jobs uses -v, --debug, --trace, or set -x.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR runs cancel the superseded run of the same PR. Pushes to main share one group and never
  # cancel each other, so a production deploy is never cut off halfway.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      # Fail when uv.lock is out of date instead of silently updating it.
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          working-directory: backend
          enable-cache: true
      - run: uv sync
      - run: uv run pytest
      - run: uv run ruff check --output-format github .
      - run: uv run ruff format --check .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  preview:
    # Only PRs from branches in this repo. Forks and Dependabot get no secrets, so they skip.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Covers queueing behind another build: Hobby builds one deployment at a time.
    timeout-minutes: 20
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the Vercel CLI
        run: npm install --global vercel@59.15.1

      - name: Deploy a preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --yes --format json | jq -r '.deployment.url // empty')
          if [[ "$url" != https://* ]]; then
            echo "::error::vercel deploy returned no deployment address"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the preview's health reply
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Retries for about 60 s, because the first request after a deploy meets a cold
          # function and a cold database pooler. Fails at once on a wrong or missing label.
          deadline=$((SECONDS + 60))
          while true; do
            body=$(curl --silent --max-time 15 \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "$URL/api/health" || true)
            backend=$(jq -r '.backend // empty' <<<"$body" 2>/dev/null || true)
            database=$(jq -r '.database // empty' <<<"$body" 2>/dev/null || true)
            project=$(jq -r '.project // empty' <<<"$body" 2>/dev/null || true)
            echo "backend=${backend:--} database=${database:--} project=${project:--}"
            if [[ -n "$project" && "$project" != "preview" ]]; then
              echo "::error::The preview reports project=$project. Check DATABASE_URL and DATABASE_LABEL in Vercel's Preview environment."
              exit 1
            fi
            if [[ "$backend" == "ok" && "$database" == "reachable" ]]; then
              echo "Health: ok, reachable, preview" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::The preview's health check didn't pass within 60 s. If database=unreachable, the preview Supabase project may be paused."
              exit 1
            fi
            sleep 5
          done

  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Skip if main has moved on
        id: tip
        run: |
          # Re-running an old run must never put old code back on production.
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo "Skipped: this run's commit ${GITHUB_SHA} is no longer the tip of main (${tip})." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PRODUCTION_URL
        if: steps.tip.outputs.skip == 'false'
        run: |
          # It must be the stable production address, not one deployment's own address.
          if [[ "$PRODUCTION_URL" != https://* ]]; then
            echo "::error::The PRODUCTION_URL variable must be set to an https address."
            exit 1
          fi
          if [[ "$PRODUCTION_URL" =~ -[a-z0-9]{9}-[a-z0-9-]+\.vercel\.app/?$ ]]; then
            echo "::error::PRODUCTION_URL looks like a single deployment's address. Use the project's production domain."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.skip == 'false'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.skip == 'false'
        with:
          node-version: 24
      - name: Install the Vercel CLI
        if: steps.tip.outputs.skip == 'false'
        run: npm install --global vercel@59.15.1

      - name: Deploy without going live
        id: deploy
        if: steps.tip.outputs.skip == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prod --skip-domain --yes --format json | jq -r '.deployment.url // empty')
          if [[ "$url" != https://* ]]; then
            echo "::error::vercel deploy returned no deployment address"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment (not live yet): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the new deployment's health reply
        if: steps.tip.outputs.skip == 'false'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # Same check as the preview job. A failure here means nothing went live.
          deadline=$((SECONDS + 60))
          while true; do
            body=$(curl --silent --max-time 15 \
              --header "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}" \
              "$URL/api/health" || true)
            backend=$(jq -r '.backend // empty' <<<"$body" 2>/dev/null || true)
            database=$(jq -r '.database // empty' <<<"$body" 2>/dev/null || true)
            project=$(jq -r '.project // empty' <<<"$body" 2>/dev/null || true)
            echo "backend=${backend:--} database=${database:--} project=${project:--}"
            if [[ -n "$project" && "$project" != "production" ]]; then
              echo "::error::The new deployment reports project=$project. Check DATABASE_URL and DATABASE_LABEL in Vercel's Production environment."
              exit 1
            fi
            if [[ "$backend" == "ok" && "$database" == "reachable" ]]; then
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::The new deployment's health check didn't pass within 60 s. Nothing went live. If database=unreachable, the production Supabase project may be paused."
              exit 1
            fi
            sleep 5
          done

      - name: Go live
        if: steps.tip.outputs.skip == 'false'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel promote "$URL" --yes --timeout 3m

      - name: Check the public production address
        if: steps.tip.outputs.skip == 'false'
        run: |
          # No bypass header: this proves students can reach it without logging in.
          deadline=$((SECONDS + 60))
          while true; do
            body=$(curl --silent --max-time 15 "$PRODUCTION_URL/api/health" || true)
            backend=$(jq -r '.backend // empty' <<<"$body" 2>/dev/null || true)
            database=$(jq -r '.database // empty' <<<"$body" 2>/dev/null || true)
            project=$(jq -r '.project // empty' <<<"$body" 2>/dev/null || true)
            echo "backend=${backend:--} database=${database:--} project=${project:--}"
            if [[ "$backend" == "ok" && "$database" == "reachable" && "$project" == "production" ]]; then
              echo "Live: $PRODUCTION_URL (ok, reachable, production)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::The public production address didn't answer ok, reachable, production within 60 s."
              exit 1
            fi
            sleep 5
          done
